/* ===================== ACTIONS ===================== */
function startSession(day){
  const key=curKey(), p=PROGRAMS[key], ps=PS(), slot=curSlot(key);
  const id='s'+Date.now().toString(36);
  const ex={}; for(const e of p.ex[day]){ const t=target(e,slot.phase); ex[e.id]={name:e.name,lab:e.lab,...(e.swapped?{swap:e.name}:{}),sets:Array.from({length:t.sets},()=>({w:null,r:null,rir:null,done:false}))}; }
  S.sessions[id]={id,program:key,progTitle:p.title,day,dayName:p.days[day].name,block:ps.block,week:slot.week,slot:ps.pos+1,phase:slot.phase,date:todayStr(),startedAt:Date.now(),finished:false,back:null,note:'',ex};
  S.settings.activeId=id; queue(id); queue('settings'); keepAwake(); ui.confirm=null; ui.fOpen=null; render(); window.scrollTo(0,0);
}
function finishSession(){
  const s=S.sessions[S.settings.activeId]; if(!s) return;
  s.finished=true; s.finishedAt=Date.now();
  for(const id in s.ex){ const v=S.settings.machine[s.program+':'+id]; if(v) s.ex[id].var=v; }
  const P0=PROGRAMS[s.program];
  if(P0){ const ps=progState(s.program); ps.pos++; if(ps.pos>=P0.slots.length){ ps.pos=0; ps.block++; } }
  S.settings.activeId=null; timer=null; saveTimer();
  queue(s.id); queue('settings');
  try{ wake&&wake.release(); }catch(e){}
  ui.tab='edzes'; ui.summary=s.id; ui.psheet=false; clearTimeout(toast._t); $('#toast').hidden=true; render(); window.scrollTo(0,0);
}
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('.tabs button'); if(tb){ ui.tab=tb.dataset.tab; ui.confirm=null; ui.summary=null; ui.psheet=false; render(); window.scrollTo(0,0); return; }
  const b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act, s=S.settings.activeId&&S.sessions[S.settings.activeId];
  if(mobAction(act,b)) return;
  if(adaptAction(act,b,s)) return;
  if(fAction(act,b,s)) return;
  if(act.startsWith('ed-')&&ui.edit){ editAction(act,b); return; }
  if(act==='ai-open'){ ui.ai={form:aiDefaults(),busy:false,err:null,ctl:null}; ui.edit=null; ui.confirm=null; render(); window.scrollTo(0,0); return; }
  if(act==='ai-cancel'){ ui.ai=null; render(); return; }
  if(act==='ai-stop'&&ui.ai){ ui.ai.ctl&&ui.ai.ctl.abort(); return; }
  if(act==='ai-go'&&ui.ai){ aiGenerate(); return; }
  if(act==='ai-paste'&&ui.ai){ const raw=($('#af-paste')||{}).value||''; let r=null;
    try{ const m=raw.slice(raw.indexOf('{'),raw.lastIndexOf('}')+1); r=JSON.parse(m); }catch(e){}
    try{ const f=ui.ai.form; if(r&&r.perWeek) f.perWeek=Math.max(1,Math.min(7,parseInt(r.perWeek,10)||f.perWeek)); const {draft,note}=draftFromAI(r,f); ui.ai=null; ui.edit={key:null,draft,note}; render(); window.scrollTo(0,0); }
    catch(e){ toast('Nem sikerült beolvasni — a teljes kódot másold be'); }
    return; }
  if(act==='psheet'){ ui.psheet=true; render(); return; }
  if(act==='psheet-x'){ ui.psheet=false; render(); return; }
  if(act==='spain'||act==='sfeel'||act==='ssave'||act==='scool'){ const ss=ui.summary&&S.sessions[ui.summary]; if(!ss) return;
    if(act==='spain'){ const v=+b.dataset.v; ss.back= ss.back===v?null:v; queue(ss.id); render(); }
    else if(act==='sfeel'){ const v=+b.dataset.v; ss.feel= ss.feel===v?null:v; queue(ss.id); render(); }
    else if(act==='ssave'){ ui.summary=null; ui.tab='elozmeny'; ui.histView='list'; ui.open=ss.id; render(); window.scrollTo(0,0); toast('Edzés mentve'); }
    else { ui.summary=null; startMob('cool'); }
    return; }
  if(act==='pday'){ ui.progDay=b.dataset.v; ui.progEx=null; render(); return; }
  if(act==='pex'){ ui.progEx=b.dataset.id; render(); const c=$('#chart'); c&&c.closest('section').scrollIntoView({block:'start',behavior:'smooth'}); return; }
  if(act==='prog'){ S.settings.program=b.dataset.prog; ui.psheet=false; queue('settings'); render(); }
  else if(act==='newprog'){ ui.psheet=false; ui.tab='info'; ui.edit=null; ui.confirm=null; render(); const el=$('#myprogs'); el&&el.scrollIntoView({block:'start'}); }
  else if(act==='pnew-blank'){ ui.edit={key:null,draft:blankDraft()}; ui.confirm=null; render(); window.scrollTo(0,0); }
  else if(act==='pnew-copy'){ ui.edit={key:null,draft:draftFrom(curKey())}; ui.confirm=null; render(); window.scrollTo(0,0); }
  else if(act==='pedit'){ const k=b.dataset.key; if(S.programs[k]){ const d=JSON.parse(JSON.stringify(S.programs[k])); d.seq=d.seq||1000; ui.edit={key:k,draft:d}; ui.confirm=null; render(); window.scrollTo(0,0); } }
  else if(act==='pdel'){ ui.confirm='pdel:'+b.dataset.key; render(); }
  else if(act==='pdel-yes'){ const k=b.dataset.key;
    if(s&&s.program===k){ toast('Előbb fejezd be vagy vesd el a folyamatban lévő edzést'); ui.confirm=null; render(); return; }
    delete S.programs[k]; rebuildPrograms(); if(S.settings.program===k){ S.settings.program='PPL'; queue('settings'); }
    queue('p_'+k); ui.confirm=null; render(); toast('Program törölve'); }
  else if(act==='start'){ if(audio==null){ try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } startSession(b.dataset.day); }
  else if(act==='addset'&&s){ s.ex[b.dataset.ex].sets.push({w:null,r:null,rir:null,done:false}); queue(s.id); render(); }
  else if(act==='rmset'&&s){ const xs=s.ex[b.dataset.ex].sets; if(xs.length>1&&!xs[xs.length-1].done) xs.pop(); queue(s.id); render(); }
  else if(act==='pain'&&s){ const v=+b.dataset.v; s.back= s.back===v?null:v; queue(s.id); render(); }
  else if(act==='finish'){ finishSession(); }
  else if(act==='discard'){ ui.confirm='discard'; render(); }
  else if(act==='discard-yes'&&s){ delete S.sessions[s.id]; S.settings.activeId=null; timer=null; saveTimer(); queue(s.id); queue('settings'); ui.confirm=null; render(); }
  else if(act==='del'){ ui.confirm='del:'+b.dataset.id; ui.open=b.dataset.id; render(); }
  else if(act==='del-yes'){ const id=b.dataset.id; delete S.sessions[id]; queue(id); ui.confirm=null; render(); toast('Edzés törölve'); }
  else if(act==='cancel'){ ui.confirm=null; render(); }
  else if(act==='t-15'&&timer){ timer.endAt-=15000; timer.beeped=false; saveTimer(); tick(); }
  else if(act==='t+15'&&timer){ if(timer.endAt<Date.now()){ timer.endAt=Date.now(); timer.total=0; } timer.endAt+=15000; timer.total+=15; timer.beeped=false; saveTimer(); tick(); }
  else if(act==='tskip'){ timer=null; saveTimer(); renderTimer(); }
  else if(act==='csv'){ exportCsv(); }
  else if(act==='backup'){ doBackup(); }
  else if(act==='restore'){ document.getElementById('restoreFile').click(); }
  else if(act==='reload'){ location.reload(); }
  else if(act==='pview'){ ui.progView=b.dataset.v; render(); }
  else if(act==='bwr'){ ui.bwRange=b.dataset.r; render(); }
  else if(act==='step'){ const k=b.dataset.key, id=k.split(':')[1]; S.settings.step=S.settings.step||{}; const cur=S.settings.step[k]||DEFAULT_STEP[id]||2.5; S.settings.step[k]=STEPS[(STEPS.indexOf(cur)+1)%STEPS.length]; queue('settings'); render(); }
});
document.addEventListener('toggle',ev=>{ const d=ev.target; if(d.classList&&d.classList.contains('hist')){ if(d.open) ui.open=d.dataset.id; else if(ui.open===d.dataset.id) ui.open=null; } },true);
document.addEventListener('input',ev=>{
  const t=ev.target, s=S.settings.activeId&&S.sessions[S.settings.activeId];
  if(mobInput(t)) return;
  if(adaptInput(t,s)) return;
  if(ui.ai&&ui.tab==='info'&&t.dataset.af){ ui.ai.form[t.dataset.af]= t.type==='checkbox'? t.checked : t.value; return; }
  if(ui.edit&&ui.tab==='info'){ const d=ui.edit.draft;
    if(t.dataset.pf){ d[t.dataset.pf]= t.type==='checkbox'? t.checked : t.value; return; }
    if(t.dataset.df){ d.days[+t.dataset.d][t.dataset.df]=t.value; return; }
    if(t.dataset.ef){ const e=d.days[+t.dataset.d].ex[+t.dataset.e]; if(t.type==='checkbox'){ e.ssNext=t.checked; render(); } else e[t.dataset.ef]=t.value; return; }
  }
  if(t.dataset.bw){ const ss=S.sessions[t.dataset.bw]; if(ss){ const v=parseBw(t.value); if(v!==ss.bw&&(v!=null||t.value.trim()==='')){ if(v==null) delete ss.bw; else ss.bw=v; queue(ss.id); } } return; }
  if(t.dataset.machine){ S.settings.machine[t.dataset.machine]=t.value; queue('settings'); return; }
  if(t.dataset.snote){ const ss=S.sessions[t.dataset.snote]; if(ss){ ss.note=t.value; queue(ss.id); } return; }
  if(!s) return;
  if(t.dataset.f==='note'){ s.note=t.value; queue(s.id); return; }
  if(t.dataset.f==='bw'){ const v=parseBw(t.value); if(v!==s.bw&&(v!=null||t.value.trim()==='')){ s.bw=v; queue(s.id); } return; }
  if(t.dataset.ex){ const q=s.ex[t.dataset.ex].sets[+t.dataset.i]; q[t.dataset.f]=num(t.value); if(t.dataset.f==='r'&&q.r!=null) delete q.unk; queue(s.id);
    const st=t.closest('.stp'); if(st){ const v=q[t.dataset.f], sm=st.querySelector('small'); st.classList.toggle('sugg',v==null); st.classList.toggle('val',v!=null); if(sm) sm.textContent= v==null&&t.placeholder? 'javasolt' : sm.dataset.l; } }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(mobChange(t)) return;
  if(adaptChange(t)) return;
  if(t.dataset.pw!=null&&ui.edit){ ui.edit.draft.phases[+t.dataset.pw]=t.value; return; }
  if(t.id==='progEx'){ ui.progEx=t.value; render(); }
  else if(t.id==='bwFrom'||t.id==='bwTo'){ if(t.value){ ui[t.id]=t.value; render(); } }
  else if(t.dataset.bw){ render(); }
  else if(t.id==='slotSel'){ PS().pos=+t.value; queue('settings'); render(); toast('Következő edzés átállítva'); }
  else if(t.id==='blk'){ const n=parseInt(t.value,10); if(n>0){ PS().block=n; queue('settings'); } }
  else if(t.id==='pf-per'&&ui.edit){ render(); }
});
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(ui.needsRender&&!(document.activeElement&&document.activeElement.matches('input,textarea,select'))) render(); },50); });
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&ui.psheet){ ui.psheet=false; render(); return; }
  if(ev.key!=='Enter') return; const t=ev.target; if(!t.dataset||!t.dataset.ex) return; ev.preventDefault();
  const ins=[...document.querySelectorAll('.sets input,.fsets input')]; const i=ins.indexOf(t); if(ins[i+1]) ins[i+1].focus(); else t.blur();
});

async function exportCsv(){
  const rows=[['Program','Blokk','Hét','Alkalom','Nap','Dátum','#','Gyakorlat','Szett','Cél ism.','Cél RIR','Súly / plusz súly (kg)','Ism. / mp / cm','Tényleges RIR','e1RM (kg)','Volumen (kg)','Gépbeállítás / variáció','Fájdalom 0–10','Testsúly (kg)','Megjegyzés']];
  for(const s of finished().slice().reverse()){
    const p=PROGRAMS[s.program], pname=p?p.short:(s.progTitle||s.program), dname=p&&p.days[s.day]?p.days[s.day].name:(s.dayName||s.day);
    for(const e of sessExList(s)){ const x=s.ex[e.id]; if(!x) continue; const t=e.reps?target(e,s.phase):{reps:'',rir:'',lastRir:null};
      if(!x.sets) continue;
      x.sets.forEach((q,i)=>{ if(!q.done) return;
        rows.push([pname,s.block,s.week,s.slot,dname,s.date,e.lab,e.name,i+1,t.reps,(i===x.sets.length-1&&t.lastRir)||t.rir,fmt(q.w),unitOf(e)==='check'?(q.done?'kész':''):q.unk?'nem számolt':(q.r??''),q.rir??'',fmt(e1rmX(q,e,s.bw??lastBw())),!e.cali&&q.w&&q.r?fmt(q.w*q.r):'',x.var||S.settings.machine[s.program+':'+e.id]||'',s.back??'',s.bw!=null?fmt2(s.bw):'',s.note||'']); });
    }
  }
  const csv='﻿'+rows.map(r=>r.map(c=>{ c=String(c); return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';')).join('\r\n');
  const name=`edzesnaplo_${todayStr()}.csv`;
  if(await saveFile(name,csv,'text/csv')) toast('CSV elkészült');
}

render(); keepAwake(); initPwa();
if(window.claude&&window.claude.use) window.claude.use('sample').then(f=>{ sampleFn=f; if(ui.tab==='info'&&!ui.edit) render(); }).catch(()=>{});
</script>
