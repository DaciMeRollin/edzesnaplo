<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edzésnapló</title>
<meta name="description" content="Edzésnapló – PPL, A/B és calisthenics program, saját programok, súly- és ismétlésjavaslat.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Edzésnapló">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app shell — sticky header, scrolling content, fixed bottom tab bar; the day's colour follows Olympic plate colours (Push red, Pull blue, Legs yellow, A blue, B green) */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface2:#e3e7eb; --fg:#14181d; --muted:#5a6570; --line:#cfd5db;
  --red:#c2392d; --blue:#1f58b5; --yellow:#b58700; --green:#27824a;
  --red-ink:#ffffff; --blue-ink:#ffffff; --yellow-ink:#1a1500; --green-ink:#ffffff;
  --good:#27824a; --warn:#9a6300; --danger:#b3261e;
  --day:var(--blue); --on-day:var(--blue-ink);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#181c22; --surface2:#222830; --fg:#e7ebef; --muted:#97a2ad; --line:#2d343d;
  --red:#ff7a6c; --blue:#7fa9ff; --yellow:#f0c33c; --green:#5ccb85;
  --red-ink:#160707; --blue-ink:#07101f; --yellow-ink:#171200; --green-ink:#06160c;
  --good:#5ccb85; --warn:#f0b54a; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#181c22; --surface2:#222830; --fg:#e7ebef; --muted:#97a2ad; --line:#2d343d;
  --red:#ff7a6c; --blue:#7fa9ff; --yellow:#f0c33c; --green:#5ccb85;
  --red-ink:#160707; --blue-ink:#07101f; --yellow-ink:#171200; --green-ink:#06160c;
  --good:#5ccb85; --warn:#f0b54a; --danger:#ff8a80; color-scheme:dark}
[data-col="red"]{--day:var(--red);--on-day:var(--red-ink)}
[data-col="blue"]{--day:var(--blue);--on-day:var(--blue-ink)}
[data-col="yellow"]{--day:var(--yellow);--on-day:var(--yellow-ink)}
[data-col="green"]{--day:var(--green);--on-day:var(--green-ink)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%}
img{max-width:100%}
[hidden]{display:none!important}
button{touch-action:manipulation}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--day);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + 90px)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);height:calc(54px + env(safe-area-inset-top,0px));padding-block:env(safe-area-inset-top,0px) 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-weight:500;color:var(--muted);font-size:14px;letter-spacing:.04em;margin-left:6px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;min-height:32px;font-weight:600}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="ok"] i{background:var(--good)} .sync[data-s="busy"] i{background:var(--warn)} .sync[data-s="err"] i,.sync[data-s="ro"] i{background:var(--danger)}

h2{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--day);border-color:var(--day);color:var(--on-day)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line));background:transparent}
.btn.big{width:100%;font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;min-height:54px}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}

.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* next-session hero */
.next{border-top:6px solid var(--day)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dayname{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;text-transform:uppercase;color:var(--day);margin:4px 0 2px}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--day);display:inline-block;flex:none}
.plan li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan{list-style:none;margin:0;padding:0}
.pid{font-family:var(--f-display);font-weight:600;color:var(--muted);width:34px;flex:none}
.plan .nm{flex:1;min-width:0}
.plan .rx{font-family:var(--f-display);font-weight:600;white-space:nowrap}

/* active session */
.sesshead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:15;background:var(--day);color:var(--on-day);border-radius:0 0 var(--r) var(--r);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;gap:12px}
.sesshead .t{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1}
.sesshead .s{font-size:13px;opacity:.85}
.sesshead .clock{margin-left:auto;font-family:var(--f-display);font-size:22px;font-weight:600}
.ex{padding:0;overflow:hidden}
.ex.done{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.exhead{padding:12px 14px 8px;display:flex;gap:10px;align-items:flex-start}
.badge{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--surface2);border-radius:6px;padding:2px 7px;flex:none;margin-top:1px}
.ex.done .badge{background:var(--good);color:var(--surface)}
.exname{font-weight:600;font-size:16px;line-height:1.25}
.meta{font-family:var(--f-display);font-weight:500;font-size:16px;color:var(--muted);letter-spacing:.02em}
.meta b{color:var(--fg);font-weight:600}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ss{border-color:var(--day);color:var(--day)}
.reco{margin:0 14px 8px;padding:9px 11px;border-radius:9px;background:color-mix(in srgb,var(--day) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--day) 30%,var(--line))}
.reco .rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reco .lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reco .val{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.reco .k{font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.reco .k.up{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.reco .k.down{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.reco .k.same,.reco .k.deload,.reco .k.new{background:var(--surface2);color:var(--muted)}
.reco .why{font-size:13px;margin:4px 0 0;color:var(--fg)}
.reco .stepb{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;font-weight:600;padding:3px 9px;min-height:30px;color:var(--muted)}
.plan .rx small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--day);text-align:right}
.last{margin:0 14px 8px;font-size:13px;color:var(--muted)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr 48px;gap:6px 8px;padding:4px 14px 12px;align-items:center}
.sets .h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.sets .n{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;height:46px;border:1px solid var(--line);background:var(--bg);border-radius:9px;text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px}
.sets input::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent);font-weight:500}
.sets .ok{height:46px;border-radius:9px;border:2px solid var(--line);background:transparent;font-size:20px;font-weight:700;color:var(--muted)}
.sets .ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.sets .lastset{grid-column:2 / -1;font-size:12px;color:var(--warn);font-weight:600;margin-top:-2px}
.sets input[data-done]{background:color-mix(in srgb,var(--good) 10%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.exfoot{border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exfoot input{flex:1;min-width:140px;height:38px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:0 10px;font-size:16px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;list-style:none;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
details.more p{margin:6px 0 0;font-size:14px}
.pain{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.pain button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;padding:0}
.pain button[aria-pressed="true"]{background:var(--day);border-color:var(--day);color:var(--on-day)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:16px;resize:vertical}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--danger) 10%,var(--surface))}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:30;padding:0 12px 8px}
.timer .in{max-width:616px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgb(0 0 0 / .25);position:relative;overflow:hidden}
.timer .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--day)}
.timer .tt{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:76px;font-variant-numeric:tabular-nums}
.timer .lbl{flex:1;min-width:0;font-size:13px;line-height:1.25;opacity:.85}
.timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);border-radius:8px;min-height:38px;padding:0 10px;font-weight:700}
.timer.over .in{background:var(--good);color:var(--surface)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"] svg{stroke:var(--day)}

/* history */
.hist{padding:0}
.hist summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.hist .d{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;text-align:center;min-width:44px}
.hist .d small{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase}
.hist .ttl{font-weight:600}
.hist .vol{font-family:var(--f-display);font-weight:600;font-size:17px;text-align:right}
.hist .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.hx{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hx:last-child{border-bottom:0}
.hx .s{font-family:var(--f-display);font-size:16px;color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* progress */
select{width:100%;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.stat .k{font-size:12px;color:var(--muted)}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

/* info */
.sched td,.sched th{text-align:center}
.sched td.cur{outline:2px solid var(--day);outline-offset:-2px;border-radius:6px;font-weight:700}
.sched td.past{color:var(--muted);text-decoration:line-through}
.info p{margin:0 0 8px}
.info ul{margin:0;padding-left:18px}
.info li{margin-bottom:5px}
.upd{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);z-index:61;background:var(--day);color:var(--on-day);border:0;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 6px 20px rgb(0 0 0 / .25);max-width:calc(100% - 32px)}
.backup{border-left:4px solid var(--warn)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:600;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){.timer .bar{transition:width .9s linear}}
/* saját program szerkesztő */
.seg{flex-wrap:wrap}
.seg button{flex:1 1 auto;font-size:14px;padding-inline:6px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:0 10px;font-size:16px}
.inp:disabled{opacity:.5}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.edex{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.edex .inp{background:var(--surface)}
.edex.ssnext{border-color:var(--day);border-bottom-style:dashed}
.edex.ssprev{border-color:var(--day);border-top-style:dashed;margin-top:-6px}
.iconb{flex:none;min-width:38px;min-height:38px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;font-weight:700}
.iconb:disabled{opacity:.35;cursor:default}
.colpick button{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line);background:var(--day);padding:0}
.colpick button[aria-pressed="true"]{outline:2px solid var(--fg)}
.edbar{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 8px);z-index:10;background:var(--bg);padding:8px 0;flex-wrap:nowrap}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--day);flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--day);flex:none}
@media (prefers-reduced-motion: no-preference){.spin{animation:spin .9s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.isprev{margin:0 14px 8px;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:13px;font-weight:600}
/* animált ábrák */
:root{--hl:#e8590c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hl:#ff9a5c}}
:root[data-theme="dark"]{--hl:#ff9a5c}
.figb{flex:none;width:84px;height:84px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:2px;display:block}
.figb.big{flex-basis:100%;width:100%;height:auto;aspect-ratio:1/1;max-height:300px;order:5;padding:6px}
.figb svg{width:100%;height:100%;display:block}
.fig .lb{stroke:var(--fg);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .far .lb{stroke:var(--muted);opacity:.75}
.fig .hand{stroke-width:2.4}.fig .foot{stroke-width:2.6}
.fig .hd{fill:var(--surface);stroke:var(--fg);stroke-width:3}
.fig .hl{stroke:var(--hl);stroke-width:6.5;fill:none;opacity:.6;stroke-linecap:round}
.fig .hlc{fill:var(--hl);opacity:.45}
.fig .gr{stroke:var(--line);stroke-width:1.5}
.fig .pr{stroke:var(--muted);stroke-width:2.5;fill:none;opacity:.7}
.fig .prf{fill:var(--surface2);stroke:var(--muted);stroke-width:1.5}
.fig .band{stroke:var(--good);stroke-width:2;fill:none;stroke-dasharray:3 2}
.mi{flex-wrap:wrap}
/* mobilitás + naptár */
.mi{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi .ok{flex:none;width:44px;height:44px;border-radius:9px;border:2px solid var(--line);background:transparent;font-size:20px;font-weight:700;color:var(--muted)}
.mi .ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.mi.done .exname{color:var(--muted)}

  for(const k in P.days){ if(!P.days[k].name) P.days[k].name=k; }

const COLS=['red','blue','yellow','green'];
const COLNAME={red:'piros',blue:'kék',yellow:'sárga',green:'zöld'};
const normRange=v=>{ const s=String(v??'').trim().replace(/\s+/g,'').replace(/-/g,'–'); return /^\d+(–\d+)?$/.test(s)?s:null; };
function ssFlags(ex){ const f=[]; ex.forEach((e,i)=>{ f[i]=!!e.ssNext && i<ex.length-1 && !(i>0&&f[i-1]); }); return f; }
function buildProgram(d){
  const per=Math.max(1,Math.min(7,parseInt(d.perWeek,10)||3));
  const name=(d.title||'').trim()||'Saját program', short=(d.label||'').trim()||name;
  const P={title:name,short,label:short+' · heti '+per,custom:true,pain:!!d.pain,days:{},ex:{},
           phases:(d.phases&&d.phases.length?d.phases:['normal']).map(p=>PHASE[p]?p:'normal')};
  const keys=[];
  (d.days||[]).forEach((day,di)=>{
    const ex=(day.ex||[]); if(!ex.length) return;
    keys.push(day.key);
    P.days[day.key]={name:(day.name||'').trim()||((di+1)+'. nap'),sub:day.sub||'',col:COLS.includes(day.col)?day.col:'blue'};
    const L=di<26?String.fromCharCode(65+di):'N'+(di+1), f=ssFlags(ex); let g=0;
    P.ex[day.key]=ex.map((e,i)=>{
      const prev=i>0&&f[i-1]; if(!prev) g++;
      const lab=L+g+(prev?'b':f[i]?'a':'');
      const r=parseInt(e.rest,10);
      return {id:e.id,lab,name:(e.name||'').trim()||'Gyakorlat',kieg:false,
        sets:Math.max(1,Math.min(10,parseInt(e.sets,10)||3)),reps:normRange(e.reps)||'8–12',rir:normRange(e.rir)||'1',
        rest:f[i]?0:(isFinite(r)?Math.max(0,r):90),alt:(e.alt||'').trim()||'—',tip:(e.tip||'').trim(),ss:f[i]?ex[i+1].id:null};
    });
  });
  let c=0; P.weeks=keys.length? P.phases.map(()=>Array.from({length:per},()=>keys[(c++)%keys.length])) : [];
  return P;
}

async function saveFile(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{
    const f=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return true; }
  }catch(e){ if(e&&e.name==='AbortError') return false; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true;
}

    S.mob=S.mob||{}; for(const k in (d.mob||{})){ if(!S.mob[k]) S.mob[k]=d.mob[k]; }

    else if(d.settings){ S.settings.machine=Object.assign({},d.settings.machine||{},S.settings.machine||{}); S.settings.step=Object.assign({},d.settings.step||{},S.settings.step||{}); }
    rebuildPrograms(); saveLocal(); render(); toast(`Visszatöltve: ${added} új edzés${padd?`, ${padd} program`:''}`);

/* ---------- Javaslat: RIR-korrigált Epley + kettős progresszió ----------
   Ismétlés bukásig egy súlyon = ism. + RIR  →  e1RM = súly × (1 + (ism.+RIR)/30)
   Fordítva: adott súlyon a cél-RIR mellett várható ism. = 30 × (e1RM/súly − 1) − cél-RIR
   A szettek közti fáradást (ismétlés-esést) a múltkori szettekből vesszük át. */
const DEFAULT_STEP={L1:5,L2:5,L4:5,L6:5,A1:5,B1:5,B2:2,B7a:2,B8a:2};
const STEPS=[1,1.25,2,2.5,5,10];
const stepFor=(prog,id)=> S.settings.step&&S.settings.step[prog+':'+id] || (prog==='CAL'?2.5:DEFAULT_STEP[id]) || 2.5;
const mid=s=>{ if(!isNumRir(s)) return 2; const [a,b]=rng(s); return (a+b)/2; };
function recommendBase(prog,e,phase,excludeId){
  const u=unitOf(e); if(u==='check'||u==='cm'||e.test) return null;
  const t=target(e,phase); if(t.lo==null) return null;
  const last=lastFor(prog,e.id,excludeId,phase!=='deload')||lastFor(prog,e.id,excludeId,false);
  if(u==='sec') return recSec(e,t,phase,last);
  if(e.cali) return recCali(prog,e,t,phase,last);
  if(!last) return {kind:'new', why:`Első alkalom: válassz olyan súlyt, amivel ${t.lo}–${t.hi} ismétlés megy úgy, hogy kb. ${t.rir} ismétlés maradjon tartalékban. Ebből számolom a következőt.`};

const altTxt=e=>String(e.alt||'').replace(/\.$/,'');
/* Izometria: +2–3 mp szettenként; L-ülésnél az össz-idő (60 mp) a mérce. */
function recSec(e,t,phase,last){
  const {lo,hi,sets:n}=t;
  if(!last) return {kind:'new',unit:'sec',why:`Első alkalom: tarts ${lo}–${hi} mp-et tiszta formában, nem bukásig${e.id==='S2'?' (a max tartásod 60–70%-a)':''}. Ebből számolom a következőt.`};
  const secs=last.sets.map(q=>q.r).filter(x=>x!=null); if(!secs.length) return null;
  const total=secs.reduce((a,b)=>a+b,0), lastTxt=`Múltkor ${secs.join(' / ')} mp (össz. ${total} mp).`;
  const fillTo=(arr,k)=>{ const v=arr.slice(0,k); while(v.length<k) v.push(v[v.length-1]); return v; };
  if(phase==='deload') return {kind:'deload',unit:'sec',reps:fillTo(secs.map(x=>Math.max(5,Math.round(x*0.8))),n),why:`${lastTxt} Deload: fele szett, kényelmes tartások (kb. 80%).`};
  if(e.total){
    if(total>=e.total&&secs.length<=3) return {kind:'up',unit:'sec',reps:null,why:`${lastTxt} Megvan a ${e.total} mp ${secs.length} szettben → következő lépcső: ${altTxt(e)}.`};
    const per=Math.min(hi,Math.max(lo,Math.max(...secs)+2)), k=Math.max(2,Math.min(n,Math.ceil(e.total/per)));
    return {kind:'same',unit:'sec',reps:Array(k).fill(per),why:`${lastTxt} Cél: összesen ${e.total} mp minél kevesebb szettben → hosszabb tartások (~${per} mp). Ha a ${e.total} mp 2–3 szettben megvan → következő lépcső.`};
  }
  if(secs.length>=n&&secs.every(x=>x>=hi)) return {kind:'up',unit:'sec',reps:Array(n).fill(lo),why:`${lastTxt} Minden szett elérte a ${hi} mp-et → következő lépcső: ${altTxt(e)}. Az új változattal ~${lo} mp-cel kezdd.`};
  return {kind:'same',unit:'sec',reps:fillTo(secs,n).map(x=>Math.min(hi,x+3)),why:`${lastTxt} Izometrikus progresszió: +2–3 mp szettenként, amíg minden szett el nem éri a ${hi} mp-et.`};
}
/* Calisthenics ismétléses gyakorlatok: lineáris ismétlés-progresszió → következő lépcső / +2,5 kg.
   Ha van plusz súly és ismert a testsúly, a terhelés = testsúly + plusz, és a súlyzós motor számol vele. */
function recCali(prog,e,t,phase,last){
  const {lo,hi,sets:n}=t;
  if(!last) return {kind:'new',why: e.explosive? `Első alkalom: ${n}×${hi} robbanékony ismétlés, maximális sebességgel — ha lassul, állj meg.` : `Első alkalom: keresd meg azt a variációt${e.plus?' / plusz súlyt':''}, amivel ${lo}–${hi} ismétlés megy úgy, hogy kb. ${t.rir} ismétlés maradjon tartalékban, és írd a Variáció mezőbe.`};
  const sets=last.sets.filter(q=>q.r!=null); if(!sets.length) return null;
  const plus0=Math.max(0,...sets.map(q=>q.w||0)), bw=lastBw(), step=stepFor(prog,e.id);
  const allTop=sets.every(q=>q.r>=hi);
  const lastTxt=`Múltkor ${plus0?'+'+fmt(plus0)+' kg × ':''}${sets.map(q=>q.r).join('/')}${sets[0].rir!=null?' @RIR '+sets.map(q=>q.rir??'?').join('/'):''}.`;
  if(e.explosive) return {kind:allTop?'up':'same',w:null,reps:Array(n).fill(hi),why: allTop? `${lastTxt} Ha mind a ${n} szett gyors és tiszta volt → emeld a célmagasságot (mellig → hasig → negatív muscle-up).` : `${lastTxt} ${n}×${hi} maximális szándékkal; a sebesség az inger, lassú ismétlésekig ne menj.`};
  if(phase==='deload') return {kind:'deload',w:plus0||null,reps:Array.from({length:n},(_,i)=>Math.max(1,sets[Math.min(i,sets.length-1)].r-2)),why:`${lastTxt} Deload: ugyanaz a variáció${plus0?' és súly':''}, fele szett, 2–3 ismétléssel kevesebb (RIR 3–4).`};
  if(plus0>0&&bw){
    const r=coreGym(prog,e,t,phase,{s:last.s,sets:last.sets.map(q=>({...q,w:(q.w||0)+bw}))});
    if(r&&r.w!=null){ r.w=Math.max(0,r.w-bw)||null; r.why=`Teljes terhelés = testsúly (${fmt(bw)} kg) + plusz súly. ${r.why}`; }
    return r;
  }
  if(allTop){
    if(e.weighted||(e.plus&&plus0)) return {kind:'up',w:plus0+step,reps:Array(n).fill(Math.min(hi,lo+1)),step,why:`${lastTxt} Minden szett elérte a ${hi}-et → +${fmt(step)} kg, és vissza ${lo}–${lo+1} ismétlésre (kettős progresszió).`};
    return {kind:'up',w:null,reps:Array(n).fill(lo),why:`${lastTxt} Minden szett elérte a ${hi}-et → következő lépcső: ${altTxt(e)}${e.plus?' (vagy +'+fmt(step)+' kg mellény)':''}. Az új variációval ~${lo} ismétléssel kezdd.`};
  }
  if(sets[0].r<lo-1&&(sets[0].rir??2)<=1) return {kind:'down',w:plus0?(Math.max(0,plus0-step)||null):null,reps:Array(n).fill(lo),why:`${lastTxt} A tartomány alja (${lo}) sem jött ki → ${plus0?'kisebb plusz súly':'könnyebb variáció'}, hogy ${lo}+ ismétlés tisztán meglegyen.`};
  const reps=Array.from({length:n},(_,i)=>{ const q=sets[Math.min(i,sets.length-1)]; return Math.min(hi,q.r+((q.rir??1)>=1?1:0)); });
  return {kind:'same',w:plus0||null,reps,step,why:`${lastTxt} Lineáris ismétlés-progresszió: szettenként +1 ismétlés, amíg minden szett el nem éri a ${hi}-et. Utána ${e.weighted||plus0?'+'+fmt(step)+' kg':'következő lépcső'}.`};
}
function coreGym(prog,e,t,phase,last){
  const lo=t.lo, hi=t.hi, rirT=mid(t.rir), n=t.sets;
  const lt=target(e,last.s.phase), lastRirT=mid(lt.rir);
  const sets=last.sets.filter(q=>q.r);
  const w0=Math.max(0,...sets.map(q=>q.w||0));
  const r1=sets[0].r;
  // testsúlyos / súly nélküli
  if(!w0){
    const allTop=sets.every(q=>q.r>=hi);
    const reps=Array.from({length:n},(_,i)=>{ const q=sets[i]||sets[sets.length-1]; return Math.min(hi,q.r+(allTop?0:1)); });
    return {kind:allTop?'up':'same', w:null, reps, why: allTop? `Múltkor minden szett elérte a ${hi} ismétlést testsúllyal → tegyél fel plusz súlyt (öv / kézisúlyzó, 2,5–5 kg).` : `Múltkor ${sets.map(q=>q.r).join('/')} ism. → ugyanígy, szettenként +1 ismétlés a cél.`};
  }
  // e1RM szettenként (hiányzó RIR = a múltkori cél-RIR)
  const caps=sets.map(q=>{ const rir=q.rir??lastRirT; const e1=(q.w||w0)*(1+(q.r+rir)/30); return {e1, capAtW0:30*(e1/w0-1)}; });
  const E=Math.max(...caps.map(c=>c.e1));
  const drops=caps.map(c=>Math.max(0,caps[0].capAtW0-c.capAtW0));
  const repsAt=(w,rir=rirT)=>30*(E/w-1)-rir;
  const step=stepFor(prog,e.id);
  const allTop=sets.length>=Math.min(lt.sets,sets.length)&&sets.every(q=>q.r>=hi);
  let w=w0, kind='same', why;
  const lastTxt=`Múltkor ${fmt(w0)} kg × ${sets.map(q=>q.r).join('/')}${sets[0].rir!=null?' @RIR '+sets.map(q=>q.rir??'?').join('/'):''} → becsült 1RM ${fmt(E)} kg.`;
  if(phase==='deload'){
    w=w0; kind='deload';
    why=`${lastTxt} Deload: a súly marad (vagy −10%: ${fmt(Math.floor(w0*0.9/step)*step)} kg), fele szett, kényelmes tempó RIR 3–4-gyel.`;
  } else if(allTop || repsAt(w0)>=hi+1){
    w=w0+step; let k=0; while(repsAt(w+step)>=hi && k<3){ w+=step; k++; }
    kind='up';
    why= allTop ? `${lastTxt} Minden szett elérte a felső határt (${hi}) → +${fmt(w-w0)} kg. Az új súlyon ~${Math.max(1,Math.round(repsAt(w)))} ismétlés várható RIR ${t.rir} mellett.`
                : `${lastTxt} Sok volt a tartalék: ${fmt(w0)} kg-mal RIR ${t.rir} mellett ~${Math.floor(repsAt(w0))} ism. menne, ez a tartomány fölött van → +${fmt(w-w0)} kg.`;
  } else if(repsAt(w0)<lo-0.5){
    w=Math.max(step,Math.floor(E/(1+(lo+1+rirT)/30)/step)*step); kind='down';
    why=`${lastTxt} A cél-RIR mellett ezen a súlyon csak ~${Math.max(0,Math.round(repsAt(w0)))} ism. jönne ki, ez a tartomány (${lo}–${hi}) alatt van → kisebb súly, hogy legalább ${lo} ismétlés tisztán meglegyen.`;
  } else {
    kind='same';
    why=`${lastTxt} Még nem érted el a ${hi} ismétlést minden szettben → marad a súly, a cél +1 ismétlés. Ha minden szett eléri a ${hi}-et, jön a súlyemelés.`;
  }
  let top = kind==='same' ? Math.max(Math.round(repsAt(w)), r1+1) : Math.round(repsAt(w, phase==='deload'?3.5:rirT));
  top=Math.max(kind==='deload'?Math.min(lo,top):lo, Math.min(hi, top));
  if(kind==='up'||kind==='down') top=Math.max(1,Math.min(hi,Math.round(repsAt(w))));
  const reps=Array.from({length:n},(_,i)=>{
    const d=drops[Math.min(i,drops.length-1)]||0;
    let r=Math.round(top-d);
    if(kind==='same'){ const q=sets[Math.min(i,sets.length-1)]; r=Math.min(hi,Math.max(r, q.r+((q.rir??1)>=1?1:0))); }
    if(i===n-1&&t.lastRir!=null) r+=Math.round(rirT); // csúcshét: utolsó szett bukásig
    return Math.max(1,r);
  });
  return {kind,w,reps,step,why};
}

// hiányzó RIR = a program szerinti cél-RIR közepe (ugyanígy számol a javaslat-motor is)

    if(exFin&&!g.includes(nx[0])) msg=`✓ ${g.map(k=>labOf(s.program,k)).join(' + ')} kész — jön: ${ne.lab}`; }

function metricOf(e){

  if(u==='sec') return {label:'Leghosszabb tartás (mp)',unit:'mp',k:'Tartás'};
  if(u==='cm') return {label:'Doboz magassága (cm) — kisebb = jobb',unit:'cm',k:'Magasság',low:true};

  return {label:'Becsült 1RM edzésenként (kg)',unit:'kg',e1:true,k:'e1RM'};
}
function progressData(prog,e){
  const m=metricOf(e);

    const bw=s.bw??lastBw();
    const sets=s.ex[e.id].sets.filter(t=>t.done&&t.r!=null&&(!m.e1||(t.r&&(e.cali||t.w)))); if(!sets.length) return null;
    const val=t=> m.e1? (e1rmX(fillRir(t,e,s.phase),e,bw)??-Infinity) : t.r;
    let best=sets[0]; for(const t of sets){ if(m.low? val(t)<val(best) : val(t)>val(best)) best=t; }
    const v=val(best); if(!isFinite(v)) return null;
    return {date:s.date,e:v,best,vol:sets.reduce((a,t)=>a+(t.w||0)*(t.r||0),0),var:s.ex[e.id].var||'',tip:`${huDate(s.date)} · ${fmt(v)} ${m.unit} · ${setStr(best,e)}`};
  }).filter(Boolean).reverse();
}

const fmt2=n=>n==null||!isFinite(n)?'':(Math.round(n*100)/100).toFixed(2).replace('.',',');
const sgn2=n=>(n>0?'+':n<0?'−':'±')+fmt2(Math.abs(n));
const isoD=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const parseD=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const weekStart=s=>{ const dt=parseD(s); dt.setDate(dt.getDate()-((dt.getDay()+6)%7)); return isoD(dt); };
const addDays=(s,n)=>{ const dt=parseD(s); dt.setDate(dt.getDate()+n); return isoD(dt); };
function parseBw(v){ const n=num(v); return n!=null&&n>=20&&n<=400? Math.round(n*100)/100 : null; }
function bwDays(){
  const m={}; for(const s of Object.values(S.sessions)) if(typeof s.bw==='number'&&isFinite(s.bw)) (m[s.date]=m[s.date]||[]).push(s.bw);
  return Object.entries(m).map(([date,a])=>({date,w:a.reduce((x,y)=>x+y,0)/a.length})).sort((a,b)=>a.date.localeCompare(b.date));
}
function bwWeeks(days){
  const m=new Map(); for(const d of days){ const k=weekStart(d.date); if(!m.has(k)) m.set(k,[]); m.get(k).push(d); }
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([wk,arr])=>({wk,n:arr.length,avg:arr.reduce((x,d)=>x+d.w,0)/arr.length,min:Math.min(...arr.map(d=>d.w)),max:Math.max(...arr.map(d=>d.w))}));
}
const lastBw=()=>{ const d=bwDays(); return d.length?d[d.length-1].w:null; };
const BW_RANGES={'4w':['4 hét',28],'12w':['12 hét',84],'6m':['6 hónap',182],'1y':['1 év',365],'all':['Összes',0],'custom':['Egyéni',0]};
const weekLabel=wk=>{ const a=parseD(wk), b=parseD(addDays(wk,6)); const o={month:'short',day:'numeric'};
  return a.getMonth()===b.getMonth()? `${a.toLocaleDateString('hu-HU',o)}–${b.getDate()}.` : `${a.toLocaleDateString('hu-HU',o)} – ${b.toLocaleDateString('hu-HU',o)}`; };
function viewBodyweight(){

  else if(r==='all') from=all[0]?all[0].date:today;
  else from=weekStart(addDays(today,-(BW_RANGES[r][1]-1)));
  const days=all.filter(d=>d.date>=from&&d.date<=to), weeks=bwWeeks(days);
  const seg=`<div class="seg" role="group" aria-label="Időszak">${Object.entries(BW_RANGES).map(([k,[l]])=>`<button data-act="bwr" data-r="${k}" aria-pressed="${k===r}">${l}</button>`).join('')}</div>`;
  const custom= r==='custom'? `<div class="grid2"><div class="field"><label for="bwFrom">Ettől</label><input class="inp" type="date" id="bwFrom" value="${from}"></div><div class="field"><label for="bwTo">Eddig</label><input class="inp" type="date" id="bwTo" value="${to}"></div></div>`:'';
  const note=`<p class="small muted" style="margin:0">A testsúlyt edzés közben, az utolsó kártyán adhatod meg (nem kötelező), vagy utólag az Előzményeknél. Napi méréseidből hetente (hétfő–vasárnap) átlagot számol.</p>`;
  if(!all.length) return `${seg}<div class="card empty"><b>Még nincs testsúly-adat</b>Edzés közben az „Edzés befejezése” gomb fölött adhatod meg, két tizedes pontossággal.</div>${note}`;
  if(!weeks.length) return `${seg}${custom}<div class="card empty"><b>Ebben az időszakban nincs mérés</b>Válassz hosszabb időszakot.</div>${note}`;
  const f=weeks[0], l=weeks[weeks.length-1], diff=l.avg-f.avg, pct=diff/f.avg*100;
  const nW=Math.round((parseD(l.wk)-parseD(f.wk))/(7*864e5)), rate=nW>0?diff/nW:null;
  const data=weeks.map(w=>({date:w.wk,e:w.avg,tip:`${weekLabel(w.wk)} · átlag ${fmt2(w.avg)} kg (${w.n} mérés)`}));
  const rows=weeks.slice().reverse().map((w,i,arr)=>{ const prev=arr[i+1]; const d=prev?w.avg-prev.avg:null;

    ${note}`;

let chartPts=[]; const CW=360, CH=210;
function chartSVG(data,opt={}){ const F=opt.fmt||fmt;
  const W=CW,H=CH,L=opt.fmt?44:34,R=8,T=18,B=24;
  let lo=Math.min(...data.map(d=>d.e)), hi=Math.max(...data.map(d=>d.e));
  if(hi-lo<(opt.fmt?1:2)){ const c=(hi+lo)/2, h=opt.fmt?0.5:2; lo=c-h; hi=c+h; }
  const raw=(hi-lo)/4, mag=10**Math.floor(Math.log10(raw)), step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  const y0=Math.floor(lo/step)*step, y1=Math.ceil(hi/step)*step;
  const X=i=> data.length===1? (L+W-R)/2 : L+i*(W-L-R)/(data.length-1);
  const Y=v=> T+(y1-v)/(y1-y0)*(H-T-B);
  chartPts=data.map((d,i)=>({x:X(i),y:Y(d.e),d}));
  let g='';
  for(let v=y0; v<=y1+1e-9; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${F(v)}</text>`; }
  const path=chartPts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const area= data.length>1? `<path d="${path} L${chartPts[chartPts.length-1].x} ${H-B} L${chartPts[0].x} ${H-B} Z" fill="var(--day)" fill-opacity=".10"/>`:'';
  const dots=chartPts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${i===chartPts.length-1?5.5:4}" fill="var(--day)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  const lp=chartPts[chartPts.length-1];
  const xl=`<text x="${chartPts[0].x}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="${data.length===1?'middle':'start'}">${huDate(data[0].date)}</text>`+(data.length>1?`<text x="${lp.x}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${huDate(data[data.length-1].date)}</text>`:'');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.label||'e1RM alakulása'}">${g}${area}<path d="${path}" fill="none" stroke="var(--day)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${Math.min(lp.x,W-R-4)}" y="${lp.y-12}" font-size="13" font-weight="700" fill="var(--fg)" text-anchor="end">${F(lp.d.e)}</text>${xl}<line id="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/></svg>`;
}
function wireChart(){
  const box=$('#chart'); if(!box) return; const svg=box.querySelector('svg'), tip=$('#tip'), xh=svg.querySelector('#xh');
  const move=ev=>{ const r=svg.getBoundingClientRect(); const x=(ev.clientX-r.left)/r.width*CW;
    let best=chartPts[0]; for(const p of chartPts) if(Math.abs(p.x-x)<Math.abs(best.x-x)) best=p;
    xh.setAttribute('x1',best.x); xh.setAttribute('x2',best.x); xh.setAttribute('visibility','visible');
    tip.hidden=false; tip.textContent=best.d.tip||`${huDate(best.d.date)} · ${fmt(best.d.e)} kg · ${setStr(best.d.best)}`;
    tip.style.left=Math.max(80,Math.min(r.width-80,best.x/CW*r.width))+'px'; tip.style.top=(best.y/CH*r.height)+'px'; };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{ tip.hidden=true; xh.setAttribute('visibility','hidden'); });
}

function saveDraft(){
  const d=ui.edit.draft;
  d.title=(d.title||'').trim(); d.label=(d.label||'').trim();
  if(!d.title){ toast('Adj nevet a programnak'); $('#pf-title')&&$('#pf-title').focus(); return; }
  for(const day of d.days) day.ex=day.ex.filter(e=>(e.name||'').trim());
  if(!d.days.length||d.days.some(day=>!day.ex.length)){ toast('Minden napon legyen legalább egy elnevezett gyakorlat'); render(); return; }
  for(const day of d.days) for(const e of day.ex){
    if(!normRange(e.reps)){ toast(`Ismétlés: pl. 8–12 vagy 10 (${e.name})`); render(); return; }
    if(!normRange(e.rir)){ toast(`RIR: pl. 1–2 vagy 1 (${e.name})`); render(); return; }
    e.reps=normRange(e.reps); e.rir=normRange(e.rir);
  }
  const key=ui.edit.key||('c'+Date.now().toString(36));
  d.updatedAt=Date.now();
  S.programs[key]=JSON.parse(JSON.stringify(d)); rebuildPrograms();
  const ps=progState(key); if(ps.pos>=PROGRAMS[key].slots.length) ps.pos=0;
  const act=S.settings.activeId&&S.sessions[S.settings.activeId];
  if(!act) S.settings.program=key;
  queue('p_'+key); queue('settings'); ui.edit=null; ui.confirm=null; ui.tab='edzes'; render(); window.scrollTo(0,0); toast('Program mentve');
}
function editAction(act,b){
  const d=ui.edit.draft, di=+b.dataset.d, ei=+b.dataset.e, mv=(arr,i,j)=>{ if(j<0||j>=arr.length) return; const [x]=arr.splice(i,1); arr.splice(j,0,x); };
  if(act==='ed-cancel'){ ui.edit=null; render(); window.scrollTo(0,0); return; }
  if(act==='ed-save'){ saveDraft(); return; }
  if(act==='ed-addday'){ const used=new Set(d.days.map(x=>x.col)); d.days.push({key:'d'+(++d.seq),name:'',sub:'',col:COLS.find(c=>!used.has(c))||'blue',ex:[newEx('x'+(++d.seq))]}); }
  else if(act==='ed-rmday') d.days.splice(di,1);
  else if(act==='ed-upday') mv(d.days,di,di-1);
  else if(act==='ed-downday') mv(d.days,di,di+1);
  else if(act==='ed-col') d.days[di].col=b.dataset.c;
  else if(act==='ed-addex'){ d.days[di].ex.push(newEx('x'+(++d.seq))); render(); const ins=document.querySelectorAll(`[data-ef="name"][data-d="${di}"]`); ins.length&&ins[ins.length-1].focus(); return; }
  else if(act==='ed-rmex') d.days[di].ex.splice(ei,1);
  else if(act==='ed-upex') mv(d.days[di].ex,ei,ei-1);
  else if(act==='ed-downex') mv(d.days[di].ex,ei,ei+1);
  else if(act==='ed-addweek') d.phases.splice(Math.max(0,d.phases.length-1),0,'normal');
  else if(act==='ed-rmweek') d.phases.splice(+b.dataset.w,1);
  render();
}

let audio=null;
function beep(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended') audio.resume(); const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=880; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(.25,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.6); o.start(); o.stop(audio.currentTime+.6);}catch(e){} try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} }
function startTimer(sec,label){ if(!sec) return; timer={endAt:Date.now()+sec*1000,total:sec,label,beeped:false}; saveTimer(); renderTimer(); }
function renderTimer(){
  const el=$('#timer');
  if(!timer||$('#frest')){ el.hidden=true; el.innerHTML=''; updateRest(); return; }
  el.hidden=false;
  if(!el.firstChild) el.innerHTML=`<div class="in"><div class="bar" id="tbar"></div><div class="tt" id="tt">0:00</div><div class="lbl" id="tl"></div><button data-act="t-15" aria-label="15 mp-cel kevesebb">−15</button><button data-act="t+15" aria-label="15 mp-cel több">+15</button><button data-act="tskip">Kész</button></div>`;
  $('#tl').textContent=timer.label; tick();
}
const mmss=s=>{ const a=Math.abs(Math.round(s)); return (s<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0'); };
// pihenő-gyűrű a fókusz fejlécben
function updateRest(){
  const slot=$('#frest'); if(!slot) return;
  if(!timer){ if(slot.firstChild) slot.innerHTML=''; slot.hidden=true; return; }
  const C=2*Math.PI*29;
  if(!slot.firstChild) slot.innerHTML=`<div class="frest" id="frin"><div class="fring"><svg viewBox="0 0 68 68" aria-hidden="true"><circle cx="34" cy="34" r="29" fill="none" style="stroke:var(--line)" stroke-width="7"/><circle id="farc" cx="34" cy="34" r="29" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="0"/></svg><div class="t num" id="frt" role="timer"></div></div><div class="lbl"><b id="frh"></b><span id="frl"></span></div><div class="bt"><button data-act="t+15" aria-label="15 mp-cel több">+15</button><button data-act="tskip">Kész</button></div></div>`;
  slot.hidden=false;
  const left=Math.ceil((timer.endAt-Date.now())/1000), frac=Math.max(0,Math.min(1,left/timer.total)), st=left<=0?'go':left<=10?'soon':'';
  $('#frin').className='frest '+st;
  const a=$('#farc'); a.style.stroke= st==='go'?'var(--good)':st==='soon'?'var(--hl)':'var(--day)'; a.setAttribute('stroke-dashoffset',(C*(1-frac)).toFixed(2));
  $('#frt').textContent= left<=0?'Mehet':mmss(left);
  $('#frh').textContent= left<=0?'Pihenő vége':'Pihenő';
  $('#frl').textContent= timer.label||'';
}
function tick(){
  const a=S.settings.activeId&&S.sessions[S.settings.activeId]; const el=$('#elapsed');
  if(a&&el) el.textContent=mmss((Date.now()-a.startedAt)/1000).replace('+','');
  if(!timer) return;
  const left=(timer.endAt-Date.now())/1000;
  if(left<=0&&!timer.beeped){ timer.beeped=true; saveTimer(); beep(); if($('#frest')) flash(); }
  if(left<-60){ timer=null; saveTimer(); renderTimer(); return; }
  if($('#frest')) updateRest();
  else if($('#tt')){
    $('#tt').textContent=mmss(left);
    $('#tbar').style.width=Math.max(0,Math.min(100,(1-left/timer.total)*100))+'%';
    $('#timer').classList.toggle('over',left<0);
  }
}
setInterval(tick,1000);
let wake=null;
async function keepAwake(){ try{ if(S.settings.activeId&&document.visibilityState==='visible'&&navigator.wakeLock&&!wake){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null); } }catch(e){} }

function historySummary(){
  const list=finished(); if(!list.length) return '';
  const by={};
  for(const s of list) for(const e of sessExList(s)){ const x=s.ex[e.id]; if(!x) continue;
    const sets=x.sets.filter(t=>t.done&&t.w&&t.r); if(!sets.length) continue;
    const k=e.name; const b=by[k]||(by[k]={n:0,best:null,last:null});
    b.n++; let top=sets[0]; for(const t of sets) if(e1rm(t)>e1rm(top)) top=t;
    if(!b.best||e1rm(top)>e1rm(b.best)) b.best=top; if(!b.last) b.last={date:s.date,set:top};
  }
  const pains=list.map(s=>s.back).filter(v=>v!=null);
  const lines=Object.entries(by).sort((a,b)=>b[1].n-a[1].n).slice(0,40).map(([k,b])=>`- ${k}: ${b.n} alkalom, legutóbb ${b.last.date} ${setStr(b.last.set)}, legjobb e1RM ${fmt(e1rm(b.best))} kg`);
  return `Edzések száma: ${list.length} (${list[list.length-1].date} – ${list[0].date}).`+
    (pains.length?` Derékfájdalom edzés közben (0–10): átlag ${fmt(pains.reduce((a,v)=>a+v,0)/pains.length)}, max ${Math.max(...pains)}.`:'')+
    (()=>{ const w=bwWeeks(bwDays()); if(!w.length) return ''; const l=w[w.length-1], f=w[Math.max(0,w.length-9)]; return ` Testsúly (heti átlag): legutóbb ${fmt2(l.avg)} kg`+(w.length>1?`, ${Math.round((parseD(l.wk)-parseD(f.wk))/6048e5)} héttel korábban ${fmt2(f.avg)} kg.`:'.'); })()+
    (()=>{ const r=recentIssues(56); return r.length? '\nJelzett gondok az elmúlt 8 hétben: '+r.slice(0,12).map(i=>`${i.ex}: ${ISSUE_S[i.type]} (${AREAS[i.area]||''}${i.sev!=null?' '+i.sev+'/10':''})`).join('; ')+'.' : ''; })()+
    `\nGyakorlatok (név: hányszor, utolsó legjobb szett súly×ism.@RIR, becsült 1RM):\n`+lines.join('\n');
}
function aiPrompt(f){

  return `Te egy tapasztalt, bizonyítékalapú erőnléti edző vagy. Állíts össze egy személyre szabott edzésprogramot az alábbi adatok alapján. Minden szöveg magyarul legyen.

SZABÁLYOK

- Az edzések férjenek bele a megadott időbe (pihenőkkel együtt). Szuperszettel (antagonista vagy nem versengő párok) lehet időt spórolni.

KIMENET: csak egy JSON objektum, más szöveg nélkül, pontosan ebben a szerkezetben:
{"title":"program neve","label":"rövid név, max 10 karakter","phases":["intro","normal","normal","peak","deload"],"notes":"2–4 mondat: miért így épül fel, mire figyeljen","days":[{"name":"nap neve","sub":"fő izomcsoportok röviden","col":"red|blue|yellow|green","ex":[{"name":"gyakorlat","sets":3,"reps":"8–12","rir":"1–2","rest":120,"ssNext":false,"alt":"alternatív gyakorlat","tip":"végrehajtás 1–2 mondatban"}]}]}

function draftFromAI(r,f){

    ex:(Array.isArray(d&&d.ex)?d.ex:[]).slice(0,14).filter(e=>e&&str(e.name,80)).map(e=>({id:'x'+(++seq),name:str(e.name,80),sets:Math.max(1,Math.min(8,parseInt(e.sets,10)||3)),
      reps:normRange(e.reps)||'8–12',rir:normRange(e.rir)||'1',rest:Math.max(0,Math.min(600,parseInt(e.rest,10)||90)),ssNext:!!e.ssNext,alt:str(e.alt,80),tip:str(e.tip,400)}))
  })).filter(d=>d.ex.length);

}

function areasFor(prog,day){
  const p=PROGRAMS[prog], cnt={}; if(!p||!p.ex[day]) return {cnt,list:[]};
  for(const e of p.ex[day]){ if(/bemelegítés/i.test(e.name)) continue; const w=e.kieg?0.5:1;
    for(const [re,as] of AREA_KW) if(re.test(e.name)) for(const a of as) cnt[a]=(cnt[a]||0)+w; }
  if(p.pain) cnt.derek=Math.max(cnt.derek||0,0.75);
  return {cnt,list:Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])};
}
const scoreBy=cnt=>e=>e.a.reduce((s,a)=>s+(cnt[a]||0),0);
function pickFrom(kinds,cnt,n,{exclude=new Set(),avoidBack=false,rot=0}={}){
  let c=MLIB.filter(e=>kinds.includes(e.k)&&!exclude.has(e.id)&&!(avoidBack&&e.bx)&&scoreBy(cnt)(e)>0);
  c.sort((x,y)=>scoreBy(cnt)(y)-scoreBy(cnt)(x)||x.id.localeCompare(y.id));
  // változatosság: azonos pontszámúak között forgat
  if(rot&&c.length>n){ const top=scoreBy(cnt)(c[0]); const tie=c.filter(e=>scoreBy(cnt)(e)===top); if(tie.length>1){ const r=rot%tie.length; c=[...tie.slice(r),...tie.slice(0,r),...c.slice(tie.length)]; } }
  const out=[], covered={};
  for(const e of c){ if(out.length>=n) break; const fresh=e.a.some(a=>cnt[a]&&!covered[a]); if(!fresh&&out.length<c.length-1&&c.length>n) continue; out.push(e); e.a.forEach(a=>covered[a]=1); }
  for(const e of c){ if(out.length>=n) break; if(!out.includes(e)) out.push(e); }
  return out;
}
const mDose=(e,lvl)=>{ if(e.k==='stat'){ const L=STRETCH_LVL[lvl||2]; return `${L.n} × ${L.s} mp${e.sd?' oldalanként':''} · érzet 4–6/10`; }
  if(e.k==='mob') return e.t?`2 perc${e.sd?' oldalanként':''}`:'3–5 × 10 mp mindegyik';
  if(e.k==='roll') return `60 mp${e.sd?' oldalanként':''}`; return e.d||''; };
const mTimer=(e,lvl)=> e.k==='stat'? STRETCH_LVL[lvl||2].s : (e.t||0);
const mItem=(e,lvl)=>({id:e.id,name:e.n,dose:mDose(e,lvl),done:false});
function rampItem(prog,day){
  const p=PROGRAMS[prog]; if(!p||!p.ex[day]) return null;
  const e=p.ex[day].find(x=>!x.kieg&&!x.skill&&!x.test&&unitOf(x)==='reps'&&!/bemelegítés/i.test(x.name)); if(!e) return null;
  let dose= e.cali? 'könnyített variáció / testsúly × 5 · a mai plusz súly fele × 3 · utána munkaszettek' : 'üres rúd vagy könnyű súly × 10 · közepes × 5 · a munkasúly ~85%-a × 2';
  try{ const slot=curSlot(prog); const rc=unitOf(e)==='reps'&&!e.cali? recommend(prog,e,slot.phase,null):null;
    if(rc&&rc.w&&rc.w>=20){ const st=stepFor(prog,e.id)||2.5, r=f=>Math.max(st,Math.round(rc.w*f/st)*st);
      dose=`${fmt(r(0.4))} kg × 8 · ${fmt(r(0.6))} kg × 5 · ${fmt(r(0.8))} kg × 3 → munkaszettek: ${fmt(rc.w)} kg`; } }catch(err){}
  return {id:'ramp',name:`Rávezető szettek: ${e.name}`,dose,done:false,note:'Pihenő köztük 60–90 mp. A többi fő gyakorlat előtt elég 1 könnyebb szett.'};
}
function genRoutine(kind,ctx){
  const lvl=S.settings.mobLvl||2, nPast=Object.values(S.mob||{}).filter(m=>m.kind===kind&&m.finished).length;
  const pain=ctx.prog&&PROGRAMS[ctx.prog]&&PROGRAMS[ctx.prog].pain;
  if(kind==='test') return MTESTS.map(t=>({id:t.id,name:t.n,dose:t.goal,done:false,test:1}));
  if(kind==='warm'){
    const {cnt}=areasFor(ctx.prog,ctx.day), ex=new Set(), items=[mItem(mlib('cardio'),lvl)];
    const IA=issueAreas(14); for(const a in IA) cnt[a]=(cnt[a]||0)+1.5;
    const dyn=pickFrom(['dyn'],cnt,4,{avoidBack:pain,rot:nPast}); if((cnt.csuklo||0)>=2&&!dyn.some(e=>e.id==='wrist')) dyn.splice(dyn.length-1,1,mlib('wrist')); dyn.forEach(e=>{ex.add(e.id); items.push(mItem(e,lvl));});
    const act=pickFrom(['act'],cnt,2,{exclude:ex,rot:nPast});
    if(pain&&!act.some(e=>e.id==='birddog')) act.splice(1,1,mlib('birddog'));
    act.filter(Boolean).forEach(e=>items.push(mItem(e,lvl)));
    const used=new Set(items.map(i=>i.id));
    for(const a of Object.values(IA).sort((x,y)=>y.max-x.max||(y.rom+y.pain)-(x.rom+x.pain)).slice(0,2)){
      const e=pickFrom(['mob'],{[a.area]:1},1,{exclude:used})[0]; if(!e) continue; used.add(e.id);
      items.push({...mItem(e,lvl),name:'Célzott: '+e.n,dose:`60–90 mp${e.sd?' oldalanként':''} · fájdalommentes tartományban`,sec:75,note:`Azért került ide, mert az elmúlt 2 hétben jelezted: ${[a.pain?'fájdalom':'',a.rom?'korlátozott mozgástartomány':'',a.tech?'technika':''].filter(Boolean).join(', ')} (${AREAS[a.area]}).`}); }
    const r=rampItem(ctx.prog,ctx.day); if(r) items.push(r);
    return items;
  }
  if(kind==='cool'){
    const {cnt,list}=areasFor(ctx.prog,ctx.day), items=[];
    const IA=issueAreas(14); for(const a in IA) cnt[a]=(cnt[a]||0)+1;
    const st=pickFrom(['stat'],cnt,Math.min(6,Math.max(4,list.length)),{avoidBack:false,rot:nPast});
    if(pain&&!st.some(e=>e.id==='s_lowback')&&st.length) st[st.length-1]=mlib('s_lowback');
    st.forEach(e=>{ const it=mItem(e,lvl); const sore=e.a.find(a=>IA[a]&&IA[a].max>=4); if(sore) it.dose=it.dose.replace(' · érzet 4–6/10','')+` · csak enyhén (≤3/10), mert ${AREAS[sore].toLowerCase()} fájt`; items.push(it); });
    const ro=pickFrom(['roll'],cnt,1,{rot:nPast}); if(ro[0]) items.push(mItem(ro[0],lvl));
    return items;
  }
  if(kind==='mob'){
    const focus=(ctx.focus&&ctx.focus.length?ctx.focus:['csipo','vadli','felsohat']).slice(0,4), items=[], used=new Set();
    const want=Math.min(4,Math.max(3,focus.length));
    for(let round=0; round<3&&items.length<want; round++) for(const a of focus){ if(items.length>=want) break;
      const e=pickFrom(['mob'],{[a]:1},1,{exclude:used,rot:nPast+round})[0]; if(e){ used.add(e.id); items.push(mItem(e,lvl)); } }
    for(const a of ['csipo','vadli','felsohat','far']){ if(items.length>=3) break; const e=pickFrom(['mob'],{[a]:1},1,{exclude:used})[0]; if(e){ used.add(e.id); items.push(mItem(e,lvl)); } }
    return items;
  }
  return [];
}

function suggestFocus(){
  const since=addDays(todayStr(),-7), cnt={};
  for(const s of finished()) if(s.date>=since){ const r=areasFor(s.program,s.day).cnt; for(const a in r) cnt[a]=(cnt[a]||0)+r[a]; }
  const p=P(); if(p&&p.pain) cnt.derek=(cnt.derek||0)+2;
  const IA=issueAreas(14); for(const a in IA) cnt[a]=(cnt[a]||0)+10+IA[a].max;
  const order=['csipo','vadli','felsohat','vall','far','combhajlito','adduktor','lats','derek','csuklo','mell'];
  const l=Object.keys(cnt).filter(a=>MLIB.some(e=>e.k==='mob'&&e.a.includes(a))).sort((a,b)=>cnt[b]-cnt[a]||order.indexOf(a)-order.indexOf(b));
  const out=l.slice(0,3); for(const a of ['csipo','vadli','felsohat']) if(out.length<3&&!out.includes(a)) out.push(a); return out;
}

function mobAction(act,b){
  const m=S.settings.mobActive&&S.mob[S.settings.mobActive];
  if(act==='figbig'){ ui.figBig=ui.figBig||{}; ui.figBig[b.dataset.id]=!ui.figBig[b.dataset.id]; render(); return true; }
  if(act==='mstart'){ if(m){ ui.tab='mob'; render(); toast('Előbb fejezd be a folyamatban lévőt'); return true; } startMob(b.dataset.k); return true; }
  if(act==='mfocus'){ const f=(ui.mobFocus||suggestFocus()).slice(), a=b.dataset.a, i=f.indexOf(a); if(i>=0) f.splice(i,1); else { if(f.length>=4) f.shift(); f.push(a); } ui.mobFocus=f.length?f:null; render(); return true; }
  if(act==='mlvl'){ S.settings.mobLvl=+b.dataset.v; queue('settings'); render(); return true; }
  if(act==='calday'){ ui.calDay=b.dataset.d; ui.calMonth=b.dataset.d.slice(0,7); ui.tab='elozmeny'; ui.histView='cal'; render(); return true; }
  if(act==='calmon'){ const ym=ui.calMonth||todayStr().slice(0,7); const [y,mo]=ym.split('-').map(Number); const d=new Date(y,mo-1+(+b.dataset.v),1); ui.calMonth=isoD(d).slice(0,7); render(); return true; }
  if(act==='hview'){ ui.histView=b.dataset.v; render(); return true; }
  if(act==='openhist'){ ui.histView='list'; ui.open=b.dataset.id; render(); const el=document.querySelector(`.hist[data-id="${b.dataset.id}"]`); el&&el.scrollIntoView({block:'start'}); return true; }
  if(act==='mdel'){ ui.confirm='mdel:'+b.dataset.id; render(); return true; }
  if(act==='mdel-yes'){ delete S.mob[b.dataset.id]; queue('m:'+b.dataset.id); ui.confirm=null; render(); toast('Törölve'); return true; }
  if(!m) return false;
  if(act==='mdone'){ const it=m.items[+b.dataset.i]; it.done=!it.done; queue('m:'+m.id); render(); return true; }
  if(act==='mtimer'){ const it=m.items[+b.dataset.i], e=mlib(it.id); const sec=it.sec||(e?mTimer(e,S.settings.mobLvl||2):0); startTimer(sec,`${it.name}${e&&e.sd?' · egyik oldal, utána a másik':''}`); return true; }
  if(act==='mswap'){ const i=+b.dataset.i, it=m.items[i], e=mlib(it.id); if(!e) return true; const used=new Set(m.items.map(x=>x.id));
    const cnt={}; e.a.forEach(a=>cnt[a]=1); const pool=MLIB.filter(x=>x.k===e.k&&!used.has(x.id)&&x.a.some(a=>cnt[a]));
    const alt=pool[0]||MLIB.find(x=>x.k===e.k&&!used.has(x.id)); if(alt){ m.items[i]=mItem(alt,S.settings.mobLvl||2); queue('m:'+m.id); render(); } else toast('Nincs több hasonló gyakorlat'); return true; }
  if(act==='madd'){ const used=new Set(m.items.map(x=>x.id)); const e=MLIB.find(x=>x.k==='mob'&&!used.has(x.id)); if(e){ m.items.push(mItem(e,S.settings.mobLvl||2)); queue('m:'+m.id); render(); } return true; }
  if(act==='mfeel'){ const v=+b.dataset.v; m.feel=m.feel===v?null:v; queue('m:'+m.id); render(); return true; }
  if(act==='mfinish'){ finishMob(); return true; }
  if(act==='mdiscard'){ ui.confirm='mdiscard'; render(); return true; }
  if(act==='mdiscard-yes'){ delete S.mob[m.id]; S.settings.mobActive=null; queue('m:'+m.id); ui.confirm=null; render(); return true; }
  return false;
}
function mobInput(t){
  const m=S.settings.mobActive&&S.mob[S.settings.mobActive];
  if(t.dataset.mv!=null&&m){ const it=m.items[+t.dataset.mv]; const v=num(t.value); it.v=it.v||{}; if(v==null) delete it.v[t.dataset.side]; else it.v[t.dataset.side]=v; if(!Object.keys(it.v).length) delete it.v; else it.done=true; queue('m:'+m.id); return true; }
  if(t.dataset.mf==='note'&&m){ m.note=t.value; queue('m:'+m.id); return true; }
  return false;
}
function mobChange(t){
  const m=S.settings.mobActive&&S.mob[S.settings.mobActive];
  if(t.id==='mdate'&&m&&t.value){ m.date=t.value; queue('m:'+m.id); return true; }
  if(t.id==='mobDay'){ ui.mobDay=t.value; render(); return true; }
  if(t.id==='mobSer'){ ui.mobSer=t.value; render(); return true; }
  if(t.dataset.sdate&&t.value){ const s=S.sessions[t.dataset.sdate]; if(s){ s.date=t.value; queue(s.id); render(); } return true; }
  if(t.dataset.mv!=null){ const it=m&&m.items[+t.dataset.mv]; const ok=t.closest('.mi')&&t.closest('.mi').querySelector('.ok'); if(it&&ok){ ok.setAttribute('aria-pressed',String(!!it.done)); t.closest('.mi').classList.toggle('done',!!it.done); } return true; }
  return false;
}

const mods=()=>(S.settings.mods||(S.settings.mods={swap:{},ssPair:{},ssOff:{}}));
const swapOf=(prog,id)=>((S.settings.mods||{}).swap||{})[prog+':'+id]||'';
function guessArea(e){ for(const [re,as] of AREA_KW) if(re.test(e.origName||e.name)) return as[0]; return 'derek'; }
function applyMods(key,P){
  const m=S.settings.mods||{}, sw=m.swap||{}, pair=m.ssPair||{}, all=(m.ssOff||{})[key];
  const pre=key+':';
  if(!all&&!Object.keys(sw).some(k=>k.startsWith(pre))&&!Object.keys(pair).some(k=>k.startsWith(pre))) return P;
  const Q={...P,ex:{}};
  for(const d in P.ex){ const arr=P.ex[d].map(e=>({...e}));
    for(const e of arr){ const s=sw[pre+e.id]; if(s){ e.origName=e.name; e.alt=e.name; e.name=s; e.swapped=true; } }
    for(const e of arr){ if(e.ss&&(all||pair[pre+e.id])){ const b=arr.find(x=>x.id===e.ss); e.pairA=e.id; e.ss=null; e.unpaired=true; if(!e.rest) e.rest=(b&&b.rest)||90; if(b){ b.ssFrom=null; b.unpaired=true; b.pairA=e.id; } } }
    Q.ex[d]=arr; }
  return Q;
}
function lastIssueFor(prog,e,exclude){
  const sw=swapOf(prog,e.id);
  for(const s of finished()){ if(s.program!==prog||s.id===exclude) continue; const x=s.ex&&s.ex[e.id]; if(!x||(x.swap||'')!==sw) continue;
    if(x.issue||x.sets.some(t=>t.done)) return x.issue? {...x.issue,date:s.date} : null; }
  return null;
}
function unkNote(prog,e,phase,excludeId,r){
  if(!r||!r.why) return r;
  const l=lastFor(prog,e.id,excludeId,phase!=='deload')||lastFor(prog,e.id,excludeId,false); if(!l||!l.unk) return r;
  return {...r,why:r.why+` (Múltkor ${l.unk} szett ${unitOf(e)==='sec'?'ideje nem volt lemérve':'ismétlésszáma nem volt megszámolva'} — azokat kihagytam a számolásból.)`};
}
function recommend(prog,e,phase,excludeId){
  let r=unkNote(prog,e,phase,excludeId,recommendBase(prog,e,phase,excludeId));
  const li=lastIssueFor(prog,e,excludeId); if(!li||!li.type) return r;
  r= r? {...r} : {kind:'same',why:''};
  const step=stepFor(prog,e.id), last=lastFor(prog,e.id,excludeId,false), w0=last? Math.max(0,...last.sets.map(q=>q.w||0))||null : null;
  const A=AREAS[li.area]||'', sev=li.sev!=null?`, ${li.sev}/10`:'';
  const hold=()=>{ if(r.kind==='up'){ r.kind='same'; if(w0!=null&&r.w!=null) r.w=w0; } };
  let pre='';
  if(li.type==='pain'&&(li.sev??5)>=4){
    pre=`⚠ Múltkor fájdalom (${A}${sev}). Ma könnyebben: kb. −15% terhelés, fájdalommentes mozgástartomány, lassú negatív. Ha ma is fáj, cseréld a gyakorlatot (⇄ Csere); ha visszatérő vagy éles, kérd szakember véleményét.`;
    const base=r.w??w0;
    if(base){ r.kind='down'; r.w=Math.max(step,Math.floor(base*0.85/step)*step); }
    else if(r.reps){ r.kind='down'; r.reps=r.reps.map(x=>Math.max(1,x-2)); }
    else r.kind='down';
  } else if(li.type==='pain'){ pre=`Múltkor enyhe fájdalom (${A}${sev}). Ma nem emelünk: marad a terhelés, figyeld, hogy ne erősödjön.`; hold(); }
  else if(li.type==='rom'){ pre=`Múltkor korlátozott volt a mozgástartomány (${A}). A bemelegítésbe bekerült erre célzott mobilizáció; ma a kontrollált, fájdalommentes tartomány a cél, a súly nem nő.`; hold(); }
  else if(li.type==='tech'){ pre=`Múltkor nem volt tiszta a technika. Ma marad a súly, a cél a tiszta kivitelezés.`; hold(); }
  else if(li.type==='equip'){ pre=`Múltkor nem volt elérhető a gép. Ha ma sem az, cseréld (⇄ Csere) — a csere külön haladást kap.`; }
  if(li.note) pre+=` Megjegyzésed: „${li.note}”.`;
  r.why=pre+(r.why?' '+r.why:''); r.issue=li; return r;
}
// ---- mobilitás-integráció
function recentIssues(days=14){
  const since=addDays(todayStr(),-days), out=[];
  for(const s of finished()) if(s.date>=since) for(const id in s.ex||{}){ const x=s.ex[id]; if(x&&x.issue&&x.issue.type&&x.issue.type!=='equip') out.push({...x.issue,area:x.issue.area||'derek',date:s.date,ex:x.name||id}); }
  return out;
}
function issueAreas(days=14){
  const m={}; for(const i of recentIssues(days)){ const a=m[i.area]||(m[i.area]={area:i.area,pain:0,rom:0,tech:0,max:0,ex:new Set()}); a[i.type]=(a[i.type]||0)+1; if(i.type==='pain') a.max=Math.max(a.max,i.sev??5); a.ex.add(i.ex); }
  return m;
}
function issueCard(){
  const IA=Object.values(issueAreas(14)).sort((a,b)=>b.max-a.max||(b.pain+b.rom)-(a.pain+a.rom));
  if(!IA.length) return '';
  const row=a=>`<div class="small"><b>${AREAS[a.area]||a.area}</b> — ${[a.pain?`fájdalom${a.max?' (max '+a.max+'/10)':''}`:'',a.rom?'korlátozott mozgástartomány':'',a.tech?'technika':''].filter(Boolean).join(', ')} <span class="muted">· ${esc([...a.ex].slice(0,3).join(', '))}</span></div>`;
  const can=IA.some(a=>MLIB.some(e=>e.k==='mob'&&e.a.includes(a.area)));
  return `<section class="card stack" style="border-left:6px solid var(--warn)"><div class="eyebrow">Figyelendő · utolsó 2 hét</div>${IA.map(row).join('')}
    <p class="small muted" style="margin:0">A bemelegítés és a nyújtás ezekre a területekre is figyel, a mobilizáció fókuszába pedig automatikusan bekerülnek. Éles, sugárzó vagy visszatérő fájdalomnál kérd szakember véleményét.</p>
    ${can?`<button class="btn sm" data-act="mobissue" style="align-self:flex-start">Mobilizáció ezekre</button>`:''}</section>`;
}

  return `<div class="isprev">⚠ Múltkor (${huDate(li.date)}): ${ISSUE_T[li.type]}${li.area?' · '+(AREAS[li.area]||''):''}${li.sev!=null&&li.type==='pain'?' · '+li.sev+'/10':''} — ${adv}</div>`;
}

  const chips=Object.entries(ISSUE_T).map(([k,l])=>`<button class="chip" data-act="iss-t" data-ex="${e.id}" data-v="${k}" aria-pressed="${!!is&&is.type===k}">${l}</button>`).join('');

  const sev= is&&is.type==='pain'? `<div><div class="small muted" style="margin-bottom:4px">Mennyire fájt? (0–10)</div><div class="pain">${Array.from({length:11},(_,i)=>`<button data-act="iss-sev" data-ex="${e.id}" data-v="${i}" aria-pressed="${is.sev===i}">${i}</button>`).join('')}</div></div>`:'';
  return `<details class="more" data-od="gd${e.id}" style="flex-basis:100%" ${open?'open':''}><summary>${is?`<span style="color:var(--warn)">⚠ Jelzett gond: ${ISSUE_T[is.type]}${is.area?' · '+AREAS[is.area]:''}</span>`:'⚠ Gond volt? (fájdalom, mozgástartomány…)'}</summary>
    <div class="stack" style="gap:8px;margin-top:6px"><div class="chips">${chips}</div>${area}${sev}
    ${is?`<input class="inp" data-iss-note="${e.id}" placeholder="Megjegyzés (pl. jobb váll eleje, mély pozícióban)" value="${esc(is.note||'')}"><p class="small muted" style="margin:0">A következő ilyen edzésnél a javaslat ehhez igazodik, és a Mobilitás fül is figyel erre a területre.</p><button class="btn sm ghost" data-act="iss-clear" data-ex="${e.id}" style="align-self:flex-start">Jelzés törlése</button>`:''}</div></details>`;
}
function altList(e){
  if(e.cali) return [];
  const src=String((e.swapped?PROGRAMS_BASE_ALT(e):e.alt)||'').split(/\s*\/\s*/);
  return [...new Set(src.map(a=>a&&a.replace(/\s*\(.*?\)\s*$/,'').trim()).filter(a=>a&&a!=='—'&&a!==e.name))].slice(0,5);
}
function PROGRAMS_BASE_ALT(e){ for(const k in BUILTIN){ for(const d in BUILTIN[k].ex){ const b=BUILTIN[k].ex[d].find(x=>x.id===e.id&&x.name===e.origName); if(b) return b.alt; } } return ''; }
function modBox(s,e){
  const open=ui.openD&&ui.openD['md'+e.id], alts=altList(e), pairA=e.pairA||(e.ss?e.id:e.ssFrom||null);
  return `<details class="more" data-od="md${e.id}" style="flex-basis:100%" ${open?'open':''}><summary>⇄ Csere / módosítás${e.swapped?' <span class="tag">cserélve</span>':''}${e.unpaired?' <span class="tag">külön szettek</span>':''}</summary>
    <div class="stack" style="gap:8px;margin-top:6px">

      ${alts.length?`<div class="small muted">Csere erre:</div><div class="chips">${alts.map(a=>`<button class="chip" data-act="mod-swap" data-ex="${e.id}" data-name="${esc(a)}">${esc(a)}</button>`).join('')}</div>`:''}
      <div class="row" style="flex-wrap:nowrap"><input class="inp" id="mc-${e.id}" placeholder="Saját gyakorlat neve" aria-label="Saját gyakorlat neve"><button class="btn sm" data-act="mod-custom" data-ex="${e.id}">Csere</button></div>
      ${e.swapped?`<button class="btn sm ghost" data-act="mod-reset" data-ex="${e.id}" style="align-self:flex-start">Vissza az eredetire</button>`:''}
      ${pairA?`<label class="row small" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" data-mod-ss="${esc(pairA)}" ${e.unpaired?'checked':''}> Szuperszett helyett külön szettek, pihenővel (ennél a párnál)</label>`:''}
      <p class="small muted" style="margin:0">A módosítás csak nálad érvényes, és a következő edzéseken is megmarad. Cserélt gyakorlatnál a súlyjavaslat külön, az új gyakorlat eredményeiből számolódik.</p>
    </div></details>`;
}
function modsCard(key){
  const m=S.settings.mods||{}, pre=key+':', sw=Object.entries(m.swap||{}).filter(([k])=>k.startsWith(pre)), pairs=Object.keys(m.ssPair||{}).filter(k=>k.startsWith(pre)&&m.ssPair[k]);
  const p=PROGRAMS[key], hasSS=Object.values(BUILTIN[key]?BUILTIN[key].ex:p.ex).flat().some(e=>e.ss);
  const nm=id=>{ for(const d in p.ex){ const e=p.ex[d].find(x=>x.id===id); if(e) return e.lab+' '+(e.origName||e.name); } return id; };
  return `<section class="card stack" id="mymods"><div class="eyebrow">Személyes módosítások · ${esc(p.title)}</div>
    ${hasSS?`<label class="row small" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" data-mod-ssall="${esc(key)}" ${(m.ssOff||{})[key]?'checked':''}> Szuperszettek helyett mindig külön szettek (ha messze vannak egymástól a gépek)</label>`:''}
    ${sw.map(([k,v])=>{ const id=k.slice(pre.length); return `<div class="row" style="flex-wrap:nowrap"><span class="small" style="flex:1">${esc(nm(id))} → <b>${esc(v)}</b></span><button class="btn sm ghost" data-act="mod-reset" data-ex="${esc(id)}" data-prog="${esc(key)}">Vissza</button></div>`; }).join('')}
    ${pairs.length&&!(m.ssOff||{})[key]?`<div class="small muted">Külön szettként: ${pairs.map(k=>esc(nm(k.slice(pre.length)))).join(', ')}</div>`:''}
    ${!sw.length&&!pairs.length&&!(m.ssOff||{})[key]?`<p class="small muted" style="margin:0">Edzés közben bármelyik gyakorlatnál a „⇄ Csere / módosítás” résznél cserélhetsz gyakorlatot, vagy bonthatod a szuperszettet. Ezek csak nálad érvényesek.</p>`:''}
    ${sw.length||pairs.length||(m.ssOff||{})[key]?`<button class="btn sm ghost" data-act="mod-resetall" data-prog="${esc(key)}" style="align-self:flex-start">Minden módosítás visszaállítása</button>`:''}
  </section>`;
}
function setSwap(prog,id,name){
  const m=mods(); m.swap=m.swap||{}; if(name) m.swap[prog+':'+id]=name; else delete m.swap[prog+':'+id];
  rebuildPrograms();
  const s=S.settings.activeId&&S.sessions[S.settings.activeId];
  if(s&&s.program===prog&&s.ex[id]){ const e=findEx(prog,id); s.ex[id].name=e?e.name:s.ex[id].name; if(name) s.ex[id].swap=name; else delete s.ex[id].swap; queue(s.id); }
  queue('settings');
}
function adaptAction(act,b,s){
  if(act==='mobissue'){ const IA=Object.values(issueAreas(14)).sort((a,b)=>b.max-a.max); ui.mobFocus=IA.map(a=>a.area).filter(a=>MLIB.some(e=>e.k==='mob'&&e.a.includes(a))).slice(0,3); startMob('mob'); return true; }
  if(act==='mod-resetall'){ const k=b.dataset.prog, m=mods(); for(const g of ['swap','ssPair']) for(const x of Object.keys(m[g]||{})) if(x.startsWith(k+':')) delete m[g][x]; if(m.ssOff) delete m.ssOff[k]; rebuildPrograms();
    const as=S.settings.activeId&&S.sessions[S.settings.activeId]; if(as&&as.program===k){ for(const id in as.ex){ const e=findEx(k,id); if(as.ex[id].swap){ delete as.ex[id].swap; if(e) as.ex[id].name=e.name; } } queue(as.id); }
    queue('settings'); render(); toast('Módosítások visszaállítva'); return true; }
  if(act==='mod-reset'&&b.dataset.prog){ setSwap(b.dataset.prog,b.dataset.ex,null); render(); return true; }
  if(!s) return false;
  const id=b.dataset.ex, x=id&&s.ex[id], e=id&&findEx(s.program,id);
  if(act==='iss-t'&&x){ const v=b.dataset.v; if(x.issue&&x.issue.type===v) delete x.issue; else x.issue={...(x.issue||{}),type:v,area:(x.issue&&x.issue.area)||guessArea(e||{name:''})}; if(x.issue&&v!=='pain') delete x.issue.sev; ui.openD=ui.openD||{}; ui.openD['gd'+id]=true; queue(s.id); render(); return true; }
  if(act==='iss-sev'&&x&&x.issue){ const v=+b.dataset.v; x.issue.sev= x.issue.sev===v? null : v; queue(s.id); render(); return true; }
  if(act==='iss-clear'&&x){ delete x.issue; queue(s.id); render(); return true; }
  if(act==='mod-swap'&&e){ setSwap(s.program,id,b.dataset.name); ui.openD=ui.openD||{}; ui.openD['md'+id]=true; render(); toast('Csere: '+b.dataset.name); return true; }
  if(act==='mod-custom'&&e){ const v=(document.getElementById('mc-'+id)||{}).value||''; if(!v.trim()){ toast('Írd be a gyakorlat nevét'); return true; } setSwap(s.program,id,v.trim().slice(0,80)); render(); toast('Csere: '+v.trim()); return true; }
  if(act==='mod-reset'&&e){ setSwap(s.program,id,null); render(); return true; }
  return false;
}
function adaptChange(t){
  const s=S.settings.activeId&&S.sessions[S.settings.activeId];
  if(t.dataset.issArea&&s){ const x=s.ex[t.dataset.issArea]; if(x&&x.issue){ x.issue.area=t.value; queue(s.id); render(); } return true; }
  if(t.dataset.modSs){ const k=(s?s.program:curKey())+':'+t.dataset.modSs, m=mods(); m.ssPair=m.ssPair||{}; if(t.checked) m.ssPair[k]=true; else delete m.ssPair[k]; rebuildPrograms(); queue('settings'); render(); return true; }
  if(t.dataset.modSsall){ const m=mods(); m.ssOff=m.ssOff||{}; if(t.checked) m.ssOff[t.dataset.modSsall]=true; else delete m.ssOff[t.dataset.modSsall]; rebuildPrograms(); queue('settings'); render(); return true; }
  return false;
}
function adaptInput(t,s){
  if(t.dataset.issNote&&s){ const x=s.ex[t.dataset.issNote]; if(x&&x.issue){ x.issue.note=t.value.slice(0,200); queue(s.id); } return true; }
  return false;
}
