- A nap-sorrend a heti rotáció: a napok ebben a sorrendben gördülnek, a hét edzésszámától függetlenül.
- A blokk hetei ezekből a fázisokból álljanak: "intro" (bevezető, RIR +1), "normal" (terhelő), "peak" (csúcshét), "deload". Tipikusan 4–6 hét, deload a végén.

KIMENET: csak egy JSON objektum, más szöveg nélkül, pontosan ebben a szerkezetben:
{"title":"program neve","label":"rövid név, max 10 karakter","phases":["intro","normal","normal","peak","deload"],"notes":"2–4 mondat: miért így épül fel, mire figyeljen","days":[{"name":"nap neve","sub":"fő izomcsoportok röviden","col":"red|blue|yellow|green","ex":[{"name":"gyakorlat","sets":3,"reps":"8–12","rir":"1–2","rest":120,"ssNext":false,"alt":"alternatív gyakorlat","tip":"végrehajtás 1–2 mondatban"}]}]}
A "ssNext": true azt jelenti, hogy a gyakorlat szuperszettben megy a következővel (csak párok).`;
}
function draftFromAI(r,f){
  if(!r||typeof r!=='object'||!Array.isArray(r.days)||!r.days.length) throw new Error('bad');
  let seq=0; const str=(v,n)=>String(v??'').trim().slice(0,n);
  const days=r.days.slice(0,7).map((d,i)=>({key:'d'+(++seq),name:str(d&&d.name,40)||((i+1)+'. nap'),sub:str(d&&d.sub,80),col:COLS.includes(d&&d.col)?d.col:COLS[i%4],
    ex:(Array.isArray(d&&d.ex)?d.ex:[]).slice(0,14).filter(e=>e&&str(e.name,80)).map(e=>({id:'x'+(++seq),name:str(e.name,80),sets:Math.max(1,Math.min(8,parseInt(e.sets,10)||3)),
      reps:normRange(e.reps)||'8–12',rir:normRange(e.rir)||'1',rest:Math.max(0,Math.min(600,parseInt(e.rest,10)||90)),ssNext:!!e.ssNext,alt:str(e.alt,80),tip:str(e.tip,400)}))
  })).filter(d=>d.ex.length);
  if(!days.length) throw new Error('bad');
  const phases=(Array.isArray(r.phases)?r.phases:[]).filter(p=>PHASE[p]).slice(0,8);
  return {draft:{title:str(r.title,60)||'AI program',label:str(r.label,14),perWeek:f.perWeek,pain:/der[eé]k|h[aá]t|gerinc|sacrum/i.test(f.limits),phases:phases.length?phases:['intro','normal','normal','peak','deload'],seq,days},note:str(r.notes,700)};
}
const AI_ERR={not_granted:'Nem engedélyezted, hogy az oldal a Claude-ot használja. Újratöltés után újra megkérdezi.',rate_limited:'Most túl sok a kérés — próbáld újra egy perc múlva.',
  invalid_json:'A válasz nem volt feldolgozható. Próbáld újra.',empty_completion:'Üres választ kaptam. Próbáld újra.',refused:'Erre a kérésre nem született program. Fogalmazd át a kéréseket.',
  session_expired:'Lejárt a bejelentkezés — töltsd újra az oldalt.',sampling_disabled:'Az AI-funkció ennél a fióknál nincs engedélyezve.',prompt_too_large:'Túl hosszú a kérés — rövidítsd a szöveges mezőket, vagy kapcsold ki az edzésadatok figyelembevételét.'};
async function aiGenerate(){
  const a=ui.ai, f=a.form; if(!sampleFn||a.busy) return;
  f.perWeek=Math.max(1,Math.min(7,parseInt(f.perWeek,10)||3)); f.minutes=parseInt(f.minutes,10)||60;
  a.busy=true; a.err=null; a.ctl=new AbortController(); render();
  try{
    const r=await sampleFn.json(aiPrompt(f),{signal:a.ctl.signal,modelTier:'default'});
    const {draft,note}=draftFromAI(r,f);
    ui.ai=null; ui.edit={key:null,draft,note}; render(); window.scrollTo(0,0);
  }catch(e){
    if(ui.ai!==a) return;
    a.busy=false; a.err= e&&e.code==='cancelled'? null : (e&&AI_ERR[e.code]) || (e&&e.message==='bad'?'A javaslat hiányos lett. Próbáld újra.':'Nem sikerült a generálás. Próbáld újra.');
    if(ui.tab==='info') render();
  }
}
function viewAI(){
  const a=ui.ai, f=a.form, sel=(k,map)=>Object.entries(map).map(([v,l])=>`<option value="${v}" ${f[k]==v?'selected':''}>${l}</option>`).join('');
  const dis=a.busy?'disabled':'';
  return `<h2 style="margin-top:22px">Program AI-val</h2>
  <div class="stack ed">
    <p class="small muted" style="margin:0">Add meg, mit szeretnél, és Claude összeállít egy programot. Mentés előtt a szerkesztőben átnézheted és átírhatod. A generálás a saját Claude-hozzáférésedet használja; az első alkalommal engedélyt kér.</p>
    <section class="card stack">
      <div class="field"><label for="af-goal">Cél</label><select id="af-goal" data-af="goal" ${dis}>${sel('goal',AI_GOALS)}</select></div>
      <div class="grid2">
        <div class="field"><label for="af-per">Edzés hetente</label><input class="inp" id="af-per" data-af="perWeek" type="number" min="1" max="7" inputmode="numeric" value="${esc(f.perWeek)}" ${dis}></div>
        <div class="field"><label for="af-min">Perc / edzés</label><input class="inp" id="af-min" data-af="minutes" type="number" min="20" max="180" step="5" inputmode="numeric" value="${esc(f.minutes)}" ${dis}></div>
      </div>
      <div class="field"><label for="af-exp">Tapasztalat</label><select id="af-exp" data-af="exp" ${dis}>${sel('exp',AI_EXP)}</select></div>
      <div class="field"><label for="af-eq">Felszerelés</label><select id="af-eq" data-af="equip" ${dis}>${sel('equip',AI_EQ)}</select></div>
      <div class="field"><label for="af-focus">Hangsúlyos izomcsoportok</label><input class="inp" id="af-focus" data-af="focus" value="${esc(f.focus)}" placeholder="pl. váll, hát, far" ${dis}></div>
      <div class="field"><label for="af-lim">Sérülés, fájdalom, korlátozás</label><textarea id="af-lim" data-af="limits" placeholder="pl. érzékeny derék, nem bírja a tengelyirányú terhelést" ${dis}>${esc(f.limits)}</textarea></div>
      <div class="field"><label for="af-likes">Kedvelt / kerülendő gyakorlatok</label><textarea id="af-likes" data-af="likes" placeholder="pl. szeretem a hack guggolást, a felhúzást kerülném" ${dis}>${esc(f.likes)}</textarea></div>
      <div class="field"><label for="af-extra">Egyéb kérés</label><textarea id="af-extra" data-af="extra" placeholder="pl. péntekenként csak 40 percem van" ${dis}>${esc(f.extra)}</textarea></div>
      ${finished().length?`<label class="row small" style="gap:8px;flex-wrap:nowrap"><input type="checkbox" data-af="useHistory" ${f.useHistory?'checked':''} ${dis}> Vegye figyelembe az eddigi edzésadataimat (${finished().length} edzés: gyakorlatok, súlyok, derékfájdalom)</label>`:''}
    </section>
    ${!sampleFn?`<div class="confirm"><span>Az AI-generálás csak a Claude alkalmazásban megnyitott verzióban működik. Itt a lenti mezőbe beillesztheted a chatben generált programot.</span></div>`:''}
    ${!sampleFn?`<section class="card stack"><div class="eyebrow">Program beillesztése</div><p class="small muted" style="margin:0">Ha a Claude-dal a chatben (vagy valaki mással) generáltattál programot kódként, másold be ide, és megnyílik a szerkesztőben.</p><textarea id="af-paste" placeholder='{"title": "...", "days": [...]}' style="min-height:110px;font-family:ui-monospace,monospace;font-size:13px"></textarea><button class="btn" data-act="ai-paste">Betöltés a szerkesztőbe</button></section>`:''}
    ${a.err?`<div class="confirm"><span>${esc(a.err)}</span></div>`:''}
    ${a.busy
      ? `<div class="card row" style="flex-wrap:nowrap"><span class="spin" aria-hidden="true"></span><div style="flex:1"><b>Claude dolgozik a programon…</b><div class="small muted">Általában 30–90 másodperc.</div></div><button class="btn sm" data-act="ai-stop">Leállítás</button></div>`
      : `<div class="row edbar"><button class="btn primary" style="flex:1" data-act="ai-go" ${sampleFn?'':'disabled'}>✨ Program generálása</button><button class="btn" data-act="ai-cancel">Mégse</button></div>`}
  </div>`;
}

/* ===================== ACTIONS ===================== */
function startSession(day){
  const key=curKey(), p=PROGRAMS[key], ps=PS(), slot=curSlot(key);
  const id='s'+Date.now().toString(36);
  const ex={}; for(const e of p.ex[day]){ const t=target(e,slot.phase); ex[e.id]={name:e.name,lab:e.lab,sets:Array.from({length:t.sets},()=>({w:null,r:null,rir:null,done:false}))}; }
  S.sessions[id]={id,program:key,progTitle:p.title,day,dayName:p.days[day].name,block:ps.block,week:slot.week,slot:ps.pos+1,phase:slot.phase,date:todayStr(),startedAt:Date.now(),finished:false,back:null,note:'',ex};
  S.settings.activeId=id; queue(id); queue('settings'); keepAwake(); ui.confirm=null; render(); window.scrollTo(0,0);
}
function finishSession(){
  const s=S.sessions[S.settings.activeId]; if(!s) return;
  s.finished=true; s.finishedAt=Date.now();
  for(const id in s.ex){ const v=S.settings.machine[s.program+':'+id]; if(v) s.ex[id].var=v; }
  const P0=PROGRAMS[s.program];
  if(P0){ const ps=progState(s.program); ps.pos++; if(ps.pos>=P0.slots.length){ ps.pos=0; ps.block++; } }
  S.settings.activeId=null; timer=null; saveTimer();
  queue(s.id); queue('settings');
  try{ wake&&wake.release(); }catch(e){}
  const {v,n}=sessVol(s); ui.tab='elozmeny'; ui.open=s.id; render(); window.scrollTo(0,0);
  toast(P0&&P0.cali? `Mentve: ${n} szett` : `Mentve: ${n} szett · ${Math.round(v).toLocaleString('hu-HU')} kg`);
}
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('.tabs button'); if(tb){ ui.tab=tb.dataset.tab; ui.confirm=null; render(); window.scrollTo(0,0); return; }
  const b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act, s=S.settings.activeId&&S.sessions[S.settings.activeId];
  if(act.startsWith('ed-')&&ui.edit){ editAction(act,b); return; }
  if(act==='ai-open'){ ui.ai={form:aiDefaults(),busy:false,err:null,ctl:null}; ui.edit=null; ui.confirm=null; render(); window.scrollTo(0,0); return; }
  if(act==='ai-cancel'){ ui.ai=null; render(); return; }
  if(act==='ai-stop'&&ui.ai){ ui.ai.ctl&&ui.ai.ctl.abort(); return; }
  if(act==='ai-go'&&ui.ai){ aiGenerate(); return; }
  if(act==='ai-paste'&&ui.ai){ const raw=($('#af-paste')||{}).value||''; let r=null;
    try{ const m=raw.slice(raw.indexOf('{'),raw.lastIndexOf('}')+1); r=JSON.parse(m); }catch(e){}
    try{ const f=ui.ai.form; if(r&&r.perWeek) f.perWeek=Math.max(1,Math.min(7,parseInt(r.perWeek,10)||f.perWeek)); const {draft,note}=draftFromAI(r,f); ui.ai=null; ui.edit={key:null,draft,note}; render(); window.scrollTo(0,0); }
    catch(e){ toast('Nem sikerült beolvasni — a teljes kódot másold be'); }
    return; }
  if(act==='prog'){ S.settings.program=b.dataset.prog; queue('settings'); render(); }
  else if(act==='newprog'){ ui.tab='info'; ui.edit=null; ui.confirm=null; render(); const el=$('#myprogs'); el&&el.scrollIntoView({block:'start'}); }
  else if(act==='pnew-blank'){ ui.edit={key:null,draft:blankDraft()}; ui.confirm=null; render(); window.scrollTo(0,0); }
  else if(act==='pnew-copy'){ ui.edit={key:null,draft:draftFrom(curKey())}; ui.confirm=null; render(); window.scrollTo(0,0); }
  else if(act==='pedit'){ const k=b.dataset.key; if(S.programs[k]){ const d=JSON.parse(JSON.stringify(S.programs[k])); d.seq=d.seq||1000; ui.edit={key:k,draft:d}; ui.confirm=null; render(); window.scrollTo(0,0); } }
  else if(act==='pdel'){ ui.confirm='pdel:'+b.dataset.key; render(); }
  else if(act==='pdel-yes'){ const k=b.dataset.key;
    if(s&&s.program===k){ toast('Előbb fejezd be vagy vesd el a folyamatban lévő edzést'); ui.confirm=null; render(); return; }
    delete S.programs[k]; rebuildPrograms(); if(S.settings.program===k){ S.settings.program='PPL'; queue('settings'); }
    queue('p_'+k); ui.confirm=null; render(); toast('Program törölve'); }
  else if(act==='start'){ if(audio==null){ try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } startSession(b.dataset.day); }
  else if(act==='done'&&s){
    const x=s.ex[b.dataset.ex], i=+b.dataset.i, q=x.sets[i];
    if(!q.done){
      ['w','r'].forEach(f=>{ if(q[f]==null){ const inp=document.getElementById(f+'-'+b.dataset.ex+'-'+i); const ph=inp&&num(inp.placeholder); if(ph!=null) q[f]=ph; } });
      q.done=true;
      const e=findEx(s.program,b.dataset.ex);
      if(e&&unitOf(e)==='check'){}
      else if(e&&e.ss) toast(((PROGRAMS[s.program]||{}).ssLabel==='párban'?'Párban → ':'Szuperszett → ')+labOf(s.program,e.ss));
      else if(e) startTimer(e.rest, `Pihenő · ${e.lab} ${i+1}/${x.sets.length} kész`);
    } else q.done=false;
    queue(s.id); render();
  }
  else if(act==='addset'&&s){ s.ex[b.dataset.ex].sets.push({w:null,r:null,rir:null,done:false}); queue(s.id); render(); }
  else if(act==='rmset'&&s){ s.ex[b.dataset.ex].sets.pop(); queue(s.id); render(); }
  else if(act==='pain'&&s){ const v=+b.dataset.v; s.back= s.back===v?null:v; queue(s.id); render(); }
  else if(act==='finish'){ finishSession(); }
  else if(act==='discard'){ ui.confirm='discard'; render(); }
  else if(act==='discard-yes'&&s){ delete S.sessions[s.id]; S.settings.activeId=null; timer=null; saveTimer(); queue(s.id); queue('settings'); ui.confirm=null; render(); }
  else if(act==='del'){ ui.confirm='del:'+b.dataset.id; ui.open=b.dataset.id; render(); }
  else if(act==='del-yes'){ const id=b.dataset.id; delete S.sessions[id]; queue(id); ui.confirm=null; render(); toast('Edzés törölve'); }
  else if(act==='cancel'){ ui.confirm=null; render(); }
  else if(act==='t-15'&&timer){ timer.endAt-=15000; timer.beeped=false; saveTimer(); tick(); }
  else if(act==='t+15'&&timer){ timer.endAt+=15000; timer.total+=15; timer.beeped=false; saveTimer(); tick(); }
  else if(act==='tskip'){ timer=null; saveTimer(); renderTimer(); }
  else if(act==='csv'){ exportCsv(); }
  else if(act==='backup'){ doBackup(); }
  else if(act==='restore'){ document.getElementById('restoreFile').click(); }
  else if(act==='reload'){ location.reload(); }
  else if(act==='pview'){ ui.progView=b.dataset.v; render(); }
  else if(act==='bwr'){ ui.bwRange=b.dataset.r; render(); }
  else if(act==='step'){ const k=b.dataset.key, id=k.split(':')[1]; S.settings.step=S.settings.step||{}; const cur=S.settings.step[k]||DEFAULT_STEP[id]||2.5; S.settings.step[k]=STEPS[(STEPS.indexOf(cur)+1)%STEPS.length]; queue('settings'); render(); }
});
document.addEventListener('toggle',ev=>{ const d=ev.target; if(d.classList&&d.classList.contains('hist')){ if(d.open) ui.open=d.dataset.id; else if(ui.open===d.dataset.id) ui.open=null; } },true);
document.addEventListener('input',ev=>{
  const t=ev.target, s=S.settings.activeId&&S.sessions[S.settings.activeId];
  if(ui.ai&&ui.tab==='info'&&t.dataset.af){ ui.ai.form[t.dataset.af]= t.type==='checkbox'? t.checked : t.value; return; }
  if(ui.edit&&ui.tab==='info'){ const d=ui.edit.draft;
    if(t.dataset.pf){ d[t.dataset.pf]= t.type==='checkbox'? t.checked : t.value; return; }
    if(t.dataset.df){ d.days[+t.dataset.d][t.dataset.df]=t.value; return; }
    if(t.dataset.ef){ const e=d.days[+t.dataset.d].ex[+t.dataset.e]; if(t.type==='checkbox'){ e.ssNext=t.checked; render(); } else e[t.dataset.ef]=t.value; return; }
  }
  if(t.dataset.bw){ const ss=S.sessions[t.dataset.bw]; if(ss){ const v=parseBw(t.value); if(v!==ss.bw&&(v!=null||t.value.trim()==='')){ if(v==null) delete ss.bw; else ss.bw=v; queue(ss.id); } } return; }
  if(t.dataset.machine){ S.settings.machine[t.dataset.machine]=t.value; queue('settings'); return; }
  if(!s) return;
  if(t.dataset.f==='note'){ s.note=t.value; queue(s.id); return; }
  if(t.dataset.f==='bw'){ const v=parseBw(t.value); if(v!==s.bw&&(v!=null||t.value.trim()==='')){ s.bw=v; queue(s.id); } return; }
  if(t.dataset.ex){ const q=s.ex[t.dataset.ex].sets[+t.dataset.i]; q[t.dataset.f]=num(t.value); queue(s.id); }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.pw!=null&&ui.edit){ ui.edit.draft.phases[+t.dataset.pw]=t.value; return; }
  if(t.id==='progEx'){ ui.progEx=t.value; render(); }
  else if(t.id==='bwFrom'||t.id==='bwTo'){ if(t.value){ ui[t.id]=t.value; render(); } }
  else if(t.dataset.bw){ render(); }
  else if(t.id==='slotSel'){ PS().pos=+t.value; queue('settings'); render(); toast('Következő edzés átállítva'); }
  else if(t.id==='blk'){ const n=parseInt(t.value,10); if(n>0){ PS().block=n; queue('settings'); } }
  else if(t.id==='pf-per'&&ui.edit){ render(); }
});
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(ui.needsRender&&!(document.activeElement&&document.activeElement.matches('input,textarea,select'))) render(); },50); });
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter') return; const t=ev.target; if(!t.dataset||!t.dataset.ex) return; ev.preventDefault();
  const ins=[...document.querySelectorAll('.sets input')]; const i=ins.indexOf(t); if(ins[i+1]) ins[i+1].focus(); else t.blur();
});

async function exportCsv(){
  const rows=[['Program','Blokk','Hét','Alkalom','Nap','Dátum','#','Gyakorlat','Szett','Cél ism.','Cél RIR','Súly / plusz súly (kg)','Ism. / mp / cm','Tényleges RIR','e1RM (kg)','Volumen (kg)','Gépbeállítás / variáció','Fájdalom 0–10','Testsúly (kg)','Megjegyzés']];
  for(const s of finished().slice().reverse()){
    const p=PROGRAMS[s.program], pname=p?p.short:(s.progTitle||s.program), dname=p&&p.days[s.day]?p.days[s.day].name:(s.dayName||s.day);
    for(const e of sessExList(s)){ const x=s.ex[e.id]; if(!x) continue; const t=e.reps?target(e,s.phase):{reps:'',rir:'',lastRir:null};
      if(!x.sets) continue;
      x.sets.forEach((q,i)=>{ if(!q.done) return;
        rows.push([pname,s.block,s.week,s.slot,dname,s.date,e.lab,e.name,i+1,t.reps,(i===x.sets.length-1&&t.lastRir)||t.rir,fmt(q.w),unitOf(e)==='check'?(q.done?'kész':''):(q.r??''),q.rir??'',fmt(e1rmX(q,e,s.bw??lastBw())),!e.cali&&q.w&&q.r?fmt(q.w*q.r):'',x.var||S.settings.machine[s.program+':'+e.id]||'',s.back??'',s.bw!=null?fmt2(s.bw):'',s.note||'']); });
    }
  }
  const csv='﻿'+rows.map(r=>r.map(c=>{ c=String(c); return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';')).join('\r\n');
  const name=`edzesnaplo_${todayStr()}.csv`;
  if(await saveFile(name,csv,'text/csv')) toast('CSV elkészült');
}

render(); keepAwake(); initPwa();
if(window.claude&&window.claude.use) window.claude.use('sample').then(f=>{ sampleFn=f; if(ui.tab==='info'&&!ui.edit) render(); }).catch(()=>{});
</script>
